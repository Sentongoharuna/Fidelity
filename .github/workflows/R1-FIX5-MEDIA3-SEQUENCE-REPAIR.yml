      - name: V16 R2 API36 quality lab gates
        shell: bash
        run: |
          set -euo pipefail
          M="app/src/main/java/com/sentongoharuna/fidelity/MainActivity.kt"
          L="app/src/main/java/com/sentongoharuna/fidelity/FidelityQualityLab.kt"
          E="app/src/main/java/com/sentongoharuna/fidelity/FidelityEnhancementBridge.kt"
          test -s "$M"
          test -s "$L"
          test -s "$E"
          grep -Fq 'TARGET_SHUTTER_NS' "$L"
          grep -Fq 'ISO_SOFT_CEILING' "$L"
          grep -Fq 'FIDELITY_REFERENCE_01' "$L"
          grep -Fq 'V16_TEMPORAL_DENOISE' "$M"
          grep -Fq 'V16_TEMPORAL_DETAIL' "$M"
          grep -Fq 'V16_PIXEL_MOTION' "$M"
