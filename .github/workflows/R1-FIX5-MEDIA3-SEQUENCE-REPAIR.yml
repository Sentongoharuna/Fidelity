          package com.sentongoharuna.fidelity

          import android.content.Context
          import androidx.media3.common.Effect
          import androidx.media3.common.VideoFrameProcessingException
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.effect.Brightness
          import androidx.media3.effect.GlEffect
          import androidx.media3.effect.GlShaderProgram

          @UnstableApi
          class FidelityAdaptiveEffect(
              private val strength: Float
          ) : GlEffect, Effect {
              override fun toGlShaderProgram(
                  context: Context,
                  useHdr: Boolean
              ): GlShaderProgram {
                  // Keep this stage GPU-backed and compile-safe on the
                  // pinned Media3 API. Strength is deliberately subtle.
                  val adjustment =
                      ((strength - 1.0f) * 0.08f)
                          .coerceIn(-0.08f,0.08f)
                  return Brightness(adjustment)
                      .toGlShaderProgram(context,useHdr)
              }
          }
          EOF

