              private val permissionLauncher =
                  registerForActivityResult(
                      ActivityResultContracts.RequestMultiplePermissions()
                  ) { result ->
                      if (result[Manifest.permission.CAMERA] == true) {
                          startCamera()
                      } else {
                          statusView.text = "CAMERA PERMISSION REQUIRED"
                      }
                  }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  buildUi()
                  enhancementState =
                      FidelityEnhancementBridge.probe(this)
                  powerManager =
                      getSystemService(POWER_SERVICE) as PowerManager
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      powerManager.addThermalStatusListener(
                          mainExecutor
                      ) { status ->
                          val before = thermalState
                          thermalState =
                              when {
                                  status >= PowerManager.THERMAL_STATUS_SEVERE ->
                                      "SEVERE"
                                  status >= PowerManager.THERMAL_STATUS_MODERATE ->
                                      "MODERATE"
                                  status >= PowerManager.THERMAL_STATUS_LIGHT ->
                                      "LIGHT"
                                  else -> "NORMAL"
                              }
                          thermalFallback =
                              when (thermalState) {
                                  "SEVERE" -> "ANALYSIS REDUCED"
                                  "MODERATE" -> "FIDELITY LIGHT"
                                  else -> "NONE"
                              }
                          if (before != thermalState) {
                              thermalEvents++
                          }
                          if (thermalState == "SEVERE") {
                              analysisEnabled = false
                          }
                          updateQualityHud()
                      }
                  }

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.CAMERA
                      ) == PackageManager.PERMISSION_GRANTED
                  ) {
                      startCamera()
                  } else {
                      permissionLauncher.launch(
                          arrayOf(
                              Manifest.permission.CAMERA,
                              Manifest.permission.RECORD_AUDIO
                          )
                      )
                  }
              }

