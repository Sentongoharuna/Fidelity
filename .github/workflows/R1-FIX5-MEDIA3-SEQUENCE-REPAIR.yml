name: R1 FIX5 MEDIA3 SEQUENCE REPAIR

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: RUNNER STARTED
        shell: bash
        run: |
          echo "R1 FIX3 runner started successfully"
          uname -a
          java -version || true

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Create independent Fidelity Cam V1 project
        shell: bash
        run: |
          set -euo pipefail

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FidelityCam"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.10.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          mkdir -p app/src/main/java/com/sentongoharuna/fidelity
          mkdir -p app/src/main/res/values

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.sentongoharuna.fidelity"
              compileSdk = 36

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {
                  applicationId = "com.sentongoharuna.fidelity"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 172532
                  versionName = "17.2.53.2"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.1")
              implementation("androidx.camera:camera-core:1.4.2")
              implementation("androidx.camera:camera-camera2:1.4.2")
              implementation("androidx.camera:camera-lifecycle:1.4.2")
              implementation("androidx.camera:camera-video:1.4.2")
              implementation("androidx.camera:camera-view:1.4.2")
              implementation("androidx.media3:media3-common:1.11.1")
              implementation("androidx.media3:media3-effect:1.11.1")
              implementation("androidx.media3:media3-transformer:1.11.1")
              implementation("com.google.android.gms:play-services-tasks:18.3.0")
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="Theme.AppCompat.DayNight.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#05080D</item>
                  <item name="android:navigationBarColor">#05080D</item>
