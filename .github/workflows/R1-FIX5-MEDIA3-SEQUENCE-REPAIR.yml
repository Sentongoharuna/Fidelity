          package com.sentongoharuna.fidelity

          import androidx.camera.core.CameraInfo
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ZoomState

          enum class FidelityScene {
              FACE,
              DETAIL,
              MOTION,
              LOW_LIGHT,
              GENERAL
          }

          data class FidelityQualityState(
              val scene: FidelityScene,
              val focus: String,
              val motion: String,
              val light: String,
              val highlights: String,
              val profile: String
          )

          object FidelitySceneIntelligence {
              fun chooseBackLens(
                  infos: List<CameraInfo>
              ): CameraSelector {
                  // Prefer a normal back camera. Avoid blindly selecting an
                  // auxiliary tele/ultrawide physical path without proof that
                  // it improves video capture on this device.
                  return CameraSelector.DEFAULT_BACK_CAMERA
              }

              fun classify(
                  exposureIndex: Int,
                  recording: Boolean,
                  focusLocked: Boolean
              ): FidelityQualityState {
                  val low = exposureIndex >= 2
                  val scene =
                      when {
                          recording -> FidelityScene.MOTION
                          low -> FidelityScene.LOW_LIGHT
                          else -> FidelityScene.DETAIL
                      }
                  return FidelityQualityState(
                      scene = scene,
                      focus = if (focusLocked) "LOCK" else "AUTO",
                      motion = if (recording) "ACTIVE" else "STABLE",
                      light = if (low) "LOW" else "GOOD",
                      highlights =
                          if (exposureIndex < 0) "PROTECTED"
                          else "AUTO",
                      profile =
                          when (scene) {
                              FidelityScene.MOTION -> "NATURAL"
                              FidelityScene.LOW_LIGHT -> "NATURAL"
                              FidelityScene.FACE -> "SKIN"
                              FidelityScene.DETAIL -> "REFERENCE"
                              FidelityScene.GENERAL -> "REFERENCE"
                          }
                  )
              }
          }
