          cat > app/src/main/java/com/sentongoharuna/fidelity/FidelityMultiFrameEngine.kt <<'EOF'
          package com.sentongoharuna.fidelity
          import java.util.ArrayDeque

          data class TemporalFrameState(
              val timestampNs: Long,
              val luma: Float,
              val detail: Float,
              val motion: Float
          )

          data class TemporalDecision(
              val historyFrames: Int,
              val noiseConfidence: Float,
              val detailConfidence: Float,
              val motionProtection: Float,
              val profile: String
          )

          class FidelityMultiFrameEngine(
              private val maxHistory: Int = 5
          ) {
              private val history = ArrayDeque<TemporalFrameState>()
              fun reset() = history.clear()

              fun push(frame: TemporalFrameState): TemporalDecision {
                  history.addLast(frame)
                  while (history.size > maxHistory) history.removeFirst()
                  if (history.size < 2)
                      return TemporalDecision(history.size,0f,0f,1f,"WARMUP")
                  val f=history.toList()
                  val meanLuma=f.map{it.luma}.average().toFloat()
                  val variance=f.map{val d=it.luma-meanLuma;d*d}.average().toFloat()
                  val meanDetail=f.map{it.detail}.average().toFloat()
                  val detailDev=f.map{kotlin.math.abs(it.detail-meanDetail)}.average().toFloat()
                  val motion=f.map{it.motion}.average().toFloat()
                  val noise=(1f-variance/400f).coerceIn(0f,1f)
                  val detail=(1f-detailDev/20f).coerceIn(0f,1f)
                  val protect=(motion/8f).coerceIn(0f,1f)
                  val profile=when {
                      protect>=0.65f -> "MOTION PROTECT"
                      noise>=0.72f && detail>=0.68f -> "TEMPORAL DETAIL"
                      noise<0.42f -> "TEMPORAL DENOISE"
                      else -> "BALANCED"
                  }
                  return TemporalDecision(f.size,noise,detail,protect,profile)
              }
          }
          EOF

