              private fun analyzeFrame(image: ImageProxy) {
                  try {
                      if (analysisShedding) {
                          return
                      }
                      val frameTs = image.imageInfo.timestamp
                      if (fpsFirstNs == 0L) fpsFirstNs = frameTs
                      if (fpsLastNs > 0L && frameTs > fpsLastNs) {
                          actualFrameDurationNs = frameTs - fpsLastNs
                          longestFrameGapNs =
                              maxOf(
                                  longestFrameGapNs,
                                  actualFrameDurationNs
                              )
                          val nominalGap =
                              if (fpsCompatibility == "29.97") {
                                  FidelityEngine.NTSC_FRAME_NS
                              } else {
                                  FidelityEngine.TARGET_FRAME_NS
                              }
                          if (
                              actualFrameDurationNs >
                              (nominalGap *
                                  FidelityEngine.DROP_GAP_MULTIPLIER)
                                  .toLong()
                          ) {
                              val estimatedMissing =
                                  kotlin.math.max(
                                      1L,
                                      (
                                          actualFrameDurationNs /
                                          nominalGap
                                      ) - 1L
                                  )
                              droppedFrames += estimatedMissing
                              dropStatus = "DROP"
                          } else if (droppedFrames == 0L) {
                              dropStatus = "CLEAR"
                          }
                          val targetNs =
                              if (fpsCompatibility == "29.97") {
                                  FidelityEngine.NTSC_FRAME_NS
                              } else {
                                  FidelityEngine.TARGET_FRAME_NS
                              }
                          val jitterNs =
                              kotlin.math.abs(
                                  actualFrameDurationNs - targetNs
                              )
                          jitterSamples++
                          jitterAbsSumNs += jitterNs.toDouble()
                          jitterRmsSumSq +=
                              jitterNs.toDouble() *
                              jitterNs.toDouble()
                          jitterMaxNs = maxOf(jitterMaxNs,jitterNs)
                          val jitterMs = jitterNs / 1_000_000.0
                          pacingStatus =
                              when {
                                  jitterMs <= 0.75 -> "STABLE"
                                  jitterMs <= 2.0 -> "WATCH"
                                  else -> "JITTER"
                              }
                          vfrTotalFrames++
                          vfrMinDurationNs =
                              minOf(
                                  vfrMinDurationNs,
                                  actualFrameDurationNs
                              )
                          vfrMaxDurationNs =
                              maxOf(
                                  vfrMaxDurationNs,
                                  actualFrameDurationNs
                              )
                          if (jitterMs > 2.0) {
                              vfrDeviationFrames++
                          }
                          val deviationRatio =
                              if (vfrTotalFrames > 0L) {
                                  vfrDeviationFrames.toDouble() /
                                  vfrTotalFrames.toDouble()
                              } else 0.0
                          vfrStatus =
                              when {
                                  vfrTotalFrames < 15L -> "LEARNING"
                                  deviationRatio <= 0.03 -> "CFR-LIKE"
                                  deviationRatio <= 0.12 -> "VARIABLE"
                                  else -> "VFR HIGH"
                              }
                          cfrOutputTarget =
                              if (fpsCompatibility == "29.97") {
                                  "29.97"
                              } else {
                                  "30.000"
                              }
                          cfrOutputStatus =
                              if (
                                  cfrOutputEnabled &&
                                  (
                                      vfrStatus == "VARIABLE" ||
                                      vfrStatus == "VFR HIGH"
                                  )
                              ) {
                                  "NORMALIZE"
                              } else if (cfrOutputEnabled) {
                                  "PRESERVE CFR"
                              } else {
                                  "OFF"
                              }
                          frameDurationStatus =
                              if (
                                  kotlin.math.abs(
                                      actualFrameDurationNs - targetNs
                                  ) <=
                                  FidelityEngine.FRAME_DURATION_TOLERANCE_NS
                              ) {
                                  "LOCK"
                              } else {
                                  "CHECK"
                              }
                          val expNs = actualExposureNs ?: 0L
                          exposureFrameRatio =
                              if (
                                  expNs > 0L &&
                                  actualFrameDurationNs > 0L
                              ) {
                                  expNs.toDouble() /
                                  actualFrameDurationNs.toDouble()
                              } else {
                                  0.0
                              }
                          exposureFrameStatus =
                              when {
                                  expNs <= 0L -> "WAIT"
                                  expNs > actualFrameDurationNs -> {
                                      exposureFrameViolations++
                                      "INVALID"
                                  }
                                  exposureFrameRatio > 0.90 -> "TIGHT"
                                  exposureFrameRatio <= 0.65 -> "HEADROOM"
                                  else -> "VALID"
                              }
                          val normalizedMotion =
                              (sceneMotion / 8.0f)
                                  .coerceIn(0f,1.5f)
                                  .toDouble()
                          motionBlurBudget =
                              (
                                  exposureFrameRatio *
                                  (0.55 + normalizedMotion)
                              ).coerceAtLeast(0.0)
                          motionBlurStatus =
                              when {
                                  expNs <= 0L -> "WAIT"
                                  motionBlurBudget <=
                                      FidelityEngine.BLUR_BUDGET_GOOD ->
                                      "SHARP"
                                  motionBlurBudget <=
                                      FidelityEngine.BLUR_BUDGET_WARN ->
                                      "WATCH"
                                  else -> {
                                      blurRiskFrames++
                                      "BLUR RISK"
                                  }
                              }
                          if (actualFrameDurationNs > 0L) {
                              when (motionBlurStatus) {
                                  "BLUR RISK" ->
                                      blurRiskTimeNs +=
                                          actualFrameDurationNs
                                  "WATCH" ->
                                      blurWatchTimeNs +=
                                          actualFrameDurationNs
                                  "SHARP" ->
                                      blurClearTimeNs +=
                                          actualFrameDurationNs
                              }
                          }
                          val previousTarget =
                              desiredShutterNs
                          if (
                              sceneMotion <=
                                  FidelityEngine.STATIC_MOTION_MAX
                          ) {
                              staticStableFrames++
                          } else {
                              staticStableFrames = 0
                          }

                          val isoNow = actualIso ?: 0
                          if (lightRecoveryState != "STABLE") {
                              shutterRelaxation = "OFF"
                              lowLightEscape = "OFF"
                          }
                          if (
                              afAeCoordination == "AF SETTLING" ||
                              afAeCoordination == "AE HOLD"
                          ) {
                              shutterRelaxation = "OFF"
                          }
                          when {
                              sceneMotion >=
                                  FidelityEngine.MOTION_ESCALATE_120 -> {
                                  desiredShutterNs =
                                      FidelityEngine.SHUTTER_MOTION_NS
                                  shutterEscalation = "1/120"
                                  shutterRelaxation = "OFF"
                              }
                              sceneMotion >=
                                  FidelityEngine.MOTION_ESCALATE_100 -> {
                                  desiredShutterNs = 10_000_000L
                                  shutterEscalation = "1/100"
                              }
                              sceneMotion >=
                                  FidelityEngine.MOTION_ESCALATE_80 ||
                                  motionBlurStatus == "WATCH" -> {
                                  desiredShutterNs =
                                      FidelityEngine.SHUTTER_DETAIL_NS
                                  shutterEscalation = "1/80"
                                  shutterRelaxation = "OFF"
                              }
                              staticStableFrames >= 12 &&
                                  isoNow >= 1000 -> {
                                  desiredShutterNs =
                                      FidelityEngine.SHUTTER_RELAX_40_NS
                                  shutterEscalation = "1/40"
                                  shutterRelaxation = "STATIC 1/40"
                              }
                              staticStableFrames >= 12 &&
                                  isoNow >=
                                      FidelityEngine.STATIC_ISO_TRIGGER -> {
                                  desiredShutterNs =
                                      FidelityEngine.SHUTTER_RELAX_48_NS
                                  shutterEscalation = "1/48"
                                  shutterRelaxation = "STATIC 1/48"
                              }
                              else -> {
                                  desiredShutterNs =
                                      FidelityEngine.SHUTTER_60_NS
                                  shutterEscalation = "1/60"
                                  shutterRelaxation = "OFF"
                              }
                          }
                          if (desiredShutterNs != previousTarget) {
                              shutterEscalations++
                              if (shutterRelaxation != "OFF") {
                                  shutterRelaxations++
                              }
                          }
                          isoShutterPolicy =
                              when {
                                  isoNow >=
                                      FidelityEngine.ISO_HARD_WARNING &&
                                      sceneMotion <=
                                      FidelityEngine.STATIC_MOTION_MAX ->
                                      "RELAX SHUTTER"
                                  isoNow >=
                                      FidelityEngine.ISO_SOFT_MAX &&
                                      sceneMotion <
                                      FidelityEngine.MOTION_ESCALATE_80 ->
                                      "REDUCE ISO PRESSURE"
                                  isoNow >
                                      FidelityEngine.ISO_PREFERRED_MAX ->
                                      "ISO WATCH"
                                  shutterEscalation == "1/100" ||
                                      shutterEscalation == "1/120" ->
                                      "MOTION PRIORITY"
                                  else -> "BALANCED"
                              }
                          if (isoShutterPolicy != previousIsoPolicy) {
                              isoNegotiations++
                              previousIsoPolicy = isoShutterPolicy
                          }
                          if (
                              desiredShutterNs != pendingShutterTargetNs
                          ) {
                              pendingShutterTargetNs =
                                  desiredShutterNs
                              pendingShutterFrames = 1
                              hysteresisState = "PENDING"
                          } else {
                              pendingShutterFrames++
                          }

                          val committedTarget =
                              if (
                                  pendingShutterFrames >=
                                  FidelityEngine.SHUTTER_HYSTERESIS_FRAMES
                              ) {
                                  if (
                                      appliedShutterTargetNs !=
                                      pendingShutterTargetNs
                                  ) {
                                      hysteresisSwitches++
                                  }
                                  hysteresisState = "COMMIT"
                                  pendingShutterTargetNs
                              } else {
                                  hysteresisState = "HOLD"
                                  appliedShutterTargetNs
                              }

                          val deltaTarget =
                              committedTarget -
                              appliedShutterTargetNs
                          if (
                              kotlin.math.abs(deltaTarget) >
                              FidelityEngine.SHUTTER_RAMP_STEP_NS
                          ) {
                              appliedShutterTargetNs +=
                                  if (deltaTarget > 0L) {
                                      FidelityEngine.SHUTTER_RAMP_STEP_NS
                                  } else {
                                      -FidelityEngine.SHUTTER_RAMP_STEP_NS
                                  }
                              shutterRampStatus = "RAMP"
                              shutterRampFrames++
                              if (shutterRampFrames == 1) {
                                  shutterRampEvents++
                              }
                          } else {
                              appliedShutterTargetNs = committedTarget
                              if (
                                  shutterRampFrames >=
                                  FidelityEngine.SHUTTER_RAMP_SETTLE_FRAMES
                              ) {
                                  shutterRampStatus = "SETTLED"
                              } else {
                                  shutterRampStatus = "STABLE"
                              }
                              shutterRampFrames = 0
                          }
                          isoCeilingState =
                              when {
                                  isoNow >=
                                      FidelityEngine.ISO_CRITICAL -> {
                                      isoCriticalHits++
                                      "CRITICAL"
                                  }
                                  isoNow >=
                                      FidelityEngine.ISO_HARD_WARNING -> {
                                      isoHardHits++
                                      "HARD"
                                  }
                                  isoNow >=
                                      FidelityEngine.ISO_SOFT_MAX -> {
                                      isoSoftHits++
                                      "SOFT"
                                  }
                                  isoNow >
                                      FidelityEngine.ISO_PREFERRED_MAX ->
                                      "WATCH"
                                  else -> "PREFERRED"
                              }
                          val escapeBefore = lowLightEscape
                          lowLightEscape =
                              when {
                                  sceneMotion >
                                      FidelityEngine.MOTION_ESCALATE_80 ->
                                      "BLOCKED BY MOTION"
                                  sceneLuma <=
                                      FidelityEngine.LOW_LIGHT_LUMA &&
                                      isoNow >=
                                      FidelityEngine.ISO_HARD_WARNING -> {
                                      desiredShutterNs =
                                          FidelityEngine.SHUTTER_ESCAPE_30_NS
                                      shutterEscalation = "1/30"
                                      "1/30"
                                  }
                                  sceneLuma <=
                                      FidelityEngine.LOW_LIGHT_LUMA &&
                                      isoNow >=
                                      FidelityEngine.ISO_SOFT_MAX -> {
                                      desiredShutterNs =
                                          FidelityEngine.SHUTTER_RELAX_40_NS
                                      shutterEscalation = "1/40"
                                      "1/40"
                                  }
                                  else -> "OFF"
                              }
                          if (
                              lowLightEscape != escapeBefore &&
                              lowLightEscape != "OFF"
                          ) {
                              lowLightEscapeCount++
                          }
                          val highlightBefore =
                              highlightShutter
                          highlightShutter =
                              when {
                                  sceneLuma <=
                                      FidelityEngine.LOW_LIGHT_LUMA ->
                                      "OFF"
                                  sceneHighlightPct >=
                                      FidelityEngine.HIGHLIGHT_CLIP_HIGH_PCT -> {
                                      desiredShutterNs =
                                          FidelityEngine.SHUTTER_HIGHLIGHT_100_NS
                                      shutterEscalation = "1/100"
                                      lowLightEscape = "OFF"
                                      "1/100"
                                  }
                                  sceneHighlightPct >=
                                      FidelityEngine.HIGHLIGHT_CLIP_WARN_PCT -> {
                                      desiredShutterNs =
                                          FidelityEngine.SHUTTER_HIGHLIGHT_80_NS
                                      shutterEscalation = "1/80"
                                      lowLightEscape = "OFF"
                                      "1/80"
                                  }
                                  else -> "OFF"
                              }
                          if (
                              highlightShutter != highlightBefore &&
                              highlightShutter != "OFF"
                          ) {
                              highlightShutterCount++
                          }

                          val actualNsForVerify =
                              actualExposureNs ?: 0L
                          if (
                              desiredShutterNs > 0L &&
                              actualNsForVerify > 0L
                          ) {
                              shutterRequestErrorPct =
                                  kotlin.math.abs(
                                      actualNsForVerify -
                                      appliedShutterTargetNs
                                  ).toDouble() /
                                  appliedShutterTargetNs.toDouble() *
                                  100.0
                              shutterRequestStatus =
                                  when {
                                      shutterRequestErrorPct <= 12.0 -> {
                                          shutterRequestPassFrames++
                                          "MATCH"
                                      }
                                      shutterRequestErrorPct <= 30.0 -> {
                                          shutterRequestMissFrames++
                                          "NEAR"
                                      }
                                      else -> {
                                          shutterRequestMissFrames++
                                          "NOT HONORED"
                                      }
                                  }
                          } else {
                              shutterRequestStatus = "WAIT"
                          }
                          val faceBefore =
                              faceMotionPriority
                          val faceScene =
                              captureProfile == "FACE"
                          faceMotionPriority =
                              when {
                                  !faceScene -> "OFF"
                                  sceneMotion >=
                                      FidelityEngine.FACE_FAST_TRIGGER -> {
                                      desiredShutterNs =
                                          FidelityEngine.FACE_FAST_SHUTTER_NS
                                      shutterEscalation = "1/100"
                                      "FACE 1/100"
                                  }
                                  sceneMotion >=
                                      FidelityEngine.FACE_MOTION_TRIGGER -> {
                                      desiredShutterNs =
                                          FidelityEngine.FACE_MOTION_SHUTTER_NS
                                      shutterEscalation = "1/80"
                                      "FACE 1/80"
                                  }
                                  else -> "FACE BASE"
                              }
                          if (
                              faceMotionPriority != faceBefore &&
                              faceMotionPriority != "OFF"
                          ) {
                              faceMotionPriorityCount++
                          }
                          val textureBefore =
                              textureDetailPriority
                          textureDetailPriority =
                              when {
                                  sceneDetail >=
                                      FidelityEngine.TEXTURE_DETAIL_TRIGGER &&
                                      sceneMotion <=
                                      FidelityEngine.TEXTURE_MOTION_LIMIT -> {
                                      desiredShutterNs =
                                          FidelityEngine.TEXTURE_SHUTTER_NS
                                      shutterEscalation = "1/80"
                                      "HAIR/FABRIC 1/80"
                                  }
                                  sceneDetail >=
                                      FidelityEngine.TEXTURE_DETAIL_TRIGGER ->
                                      "HAIR/FABRIC MOTION"
                                  else -> "OFF"
                              }
                          if (
                              textureDetailPriority != textureBefore &&
                              textureDetailPriority != "OFF"
                          ) {
                              textureDetailPriorityCount++
                          }
                          val structureBefore =
                              structureDetailPriority
                          structureDetailPriority =
                              when {
                                  sceneDetail >=
                                      FidelityEngine.STRUCTURE_DETAIL_TRIGGER &&
                                      sceneMotion <=
                                      FidelityEngine.STRUCTURE_MOTION_LIMIT &&
                                      sceneHighlightPct < 8f -> {
                                      desiredShutterNs =
                                          FidelityEngine.STRUCTURE_SHUTTER_NS
                                      shutterEscalation = "1/80"
                                      "TEXT/BUILDING 1/80"
                                  }
                                  sceneDetail >=
                                      FidelityEngine.STRUCTURE_DETAIL_TRIGGER &&
                                      sceneMotion >
                                      FidelityEngine.STRUCTURE_MOTION_LIMIT ->
                                      "TEXT/BUILDING MOTION"
                                  sceneDetail >=
                                      FidelityEngine.STRUCTURE_DETAIL_TRIGGER &&
                                      sceneHighlightPct >= 8f ->
                                      "TEXT/BUILDING HL"
                                  else -> "OFF"
                              }
                          if (
                              structureDetailPriority != structureBefore &&
                              structureDetailPriority != "OFF"
                          ) {
                              structureDetailPriorityCount++
                          }
                          movementClass =
                              when {
                                  sceneMotion >= FidelityEngine.WALK_MOTION_MIN -> {
                                      walkFrames++
                                      "WALKING"
                                  }
                                  sceneMotion >= FidelityEngine.PAN_MOTION_MIN &&
                                      sceneMotion < FidelityEngine.PAN_MOTION_MAX -> {
                                      panFrames++
                                      "PANNING"
                                  }
                                  sceneMotion > 1.1f -> "MOVING"
                                  else -> "STATIC"
                              }
                          when (movementClass) {
                              "WALKING" -> {
                                  desiredShutterNs =
                                      FidelityEngine.SHUTTER_MOTION_NS
                                  shutterEscalation =
                                      if (stabilizationState == "ACTIVE") {
                                          "1/120 STAB"
                                      } else {
                                          "1/120 NO-STAB"
                                      }
                              }
                              "PANNING" -> {
                                  desiredShutterNs = 10_000_000L
                                  shutterEscalation =
                                      if (stabilizationState == "ACTIVE") {
                                          "1/100 STAB"
                                      } else {
                                          "1/100 NO-STAB"
                                      }
                              }
                          }
                          fpsFrames++
                          val span = frameTs - fpsFirstNs
                          if (span > 0L) {
                              measuredFps30 =
                                  fpsFrames.toDouble() * 1_000_000_000.0 /
                                  span.toDouble()
                              val d30 =
                                  kotlin.math.abs(measuredFps30 - 30.0)
                              val d2997 =
                                  kotlin.math.abs(
                                      measuredFps30 -
                                      FidelityEngine.NTSC_FPS
                                  )
                              fpsCompatibility =
                                  if (d2997 < d30) "29.97"
                                  else "30.000"
                          }
                      }
                      fpsLastNs = frameTs
                      fpsWindowNs[fpsWindowIndex] = frameTs
                      fpsWindowIndex =
                          (fpsWindowIndex + 1) % fpsWindowNs.size
                      if (fpsWindowCount < fpsWindowNs.size) {
                          fpsWindowCount++
                      }
                      if (fpsWindowCount >= 2) {
                          var oldest = Long.MAX_VALUE
                          var newest = 0L
                          for (v in fpsWindowNs) {
                              if (v > 0L) {
                                  oldest = minOf(oldest,v)
                                  newest = maxOf(newest,v)
                              }
                          }
                          val rollingSpan = newest - oldest
                          if (
                              oldest != Long.MAX_VALUE &&
                              rollingSpan > 0L
                          ) {
                              rollingFps =
                                  (fpsWindowCount - 1).toDouble() *
                                  1_000_000_000.0 /
                                  rollingSpan.toDouble()
                              measuredFps60 = rollingFps
                              val d60000 =
                                  kotlin.math.abs(
                                      measuredFps60 - 60.0
                                  )
                              val d5994 =
                                  kotlin.math.abs(
                                      measuredFps60 -
                                      FidelityEngine.NTSC_5994_FPS
                                  )
                              fps60Compatibility =
                                  if (d5994 < d60000) {
                                      "59.94"
                                  } else {
                                      "60.000"
                                  }
                              fps60Status =
                                  when {
                                      kotlin.math.abs(
                                          measuredFps60 - 60.0
                                      ) <= 0.50 -> "60 LOCK"
                                      measuredFps60 >= 55.0 ->
                                          "60 NEAR"
                                      else -> "60 FALLBACK"
                                  }
                              minObservedFps =
                                  minOf(minObservedFps,rollingFps)
                              maxObservedFps =
                                  maxOf(maxObservedFps,rollingFps)
                              if (rollingFps > 0.0) {
                                  fpsSampleCount++
                                  fpsSampleSum += rollingFps
                              }
                              val fpsDeficit =
                                  kotlin.math.max(0.0,30.0-rollingFps)
                              val jitterPressure =
                                  if (pacingStatus == "JITTER") 2.0
                                  else if (pacingStatus == "WATCH") 1.0
                                  else 0.0
                              val dropPressure =
                                  kotlin.math.min(4.0,droppedFrames.toDouble())
                              val thermalPressure =
                                  when (thermalState) {
                                      "SEVERE" -> 4.0
                                      "MODERATE" -> 2.0
                                      "LIGHT" -> 1.0
                                      else -> 0.0
                                  }
                              encoderPressureScore =
                                  fpsDeficit+jitterPressure+
                                  dropPressure+thermalPressure
                              val oldEncoder = encoderLoadState
                              encoderLoadState =
                                  when {
                                      encoderPressureScore >= 7.0 -> "CRITICAL"
                                      encoderPressureScore >= 4.0 -> "HIGH"
                                      encoderPressureScore >= 2.0 -> "WATCH"
                                      else -> "NORMAL"
                                  }
                              if (oldEncoder != encoderLoadState) {
                                  encoderLoadEvents++
                              }
                              val oldProtection =
                                  frameLossProtection
                              frameLossProtection =
                                  when {
                                      encoderLoadState == "CRITICAL" ->
                                          "CAPTURE PRIORITY"
                                      encoderLoadState == "HIGH" ||
                                          droppedFrames > 0L ->
                                          "SHED ANALYSIS"
                                      else -> "NORMAL"
                                  }
                              analysisShedding =
                                  frameLossProtection != "NORMAL"
                              val previousFallback =
                                  recordingFallback
                              recordingFallback =
                                  when {
                                      frameLossProtection ==
                                          "CAPTURE PRIORITY" ->
                                          "VIDEO ONLY"
                                      frameLossProtection ==
                                          "SHED ANALYSIS" ->
                                          "VIDEO + MINIMAL"
                                      !analysisEnabled ->
                                          "VIDEO + NO ANALYSIS"
                                      else -> "FULL"
                                  }
                              if (
                                  recordingFallback !=
                                  previousFallback
                              ) {
                                  recordingFallbackEvents++
                              }
                              if (
                                  oldProtection !=
                                  frameLossProtection
                              ) {
                                  frameLossProtectionEvents++
                              }
                              val requestedFps =
                                  if (fpsCompatibility == "29.97") {
                                      FidelityEngine.NTSC_FPS
                                  } else {
                                      30.0
                                  }
                              fpsRequestError =
                                  kotlin.math.abs(
                                      rollingFps - requestedFps
                                  )
                              fpsRequestStatus =
                                  when {
                                      fpsRequestError <= 0.20 -> {
                                          fpsRequestMatchSamples++
                                          "MATCH"
                                      }
                                      fpsRequestError <= 0.75 -> {
                                          fpsRequestMissSamples++
                                          "NEAR"
                                      }
                                      else -> {
                                          fpsRequestMissSamples++
                                          "NOT HONORED"
                                      }
                                  }
                          }
                      }
                      analysisFrameCounter++
                      // Sample only every 6th analysis frame to protect recording.
                      if (analysisFrameCounter % 6 != 0) return

                      val plane = image.planes.firstOrNull() ?: return
                      val buffer = plane.buffer
                      val rowStride = plane.rowStride
                      val pixelStride = plane.pixelStride
                      val width = image.width
                      val height = image.height
                      if (width <= 0 || height <= 0) return

                      var sum = 0L
                      var count = 0
                      var highlights = 0
                      var detailSum = 0L
                      val stepX = 16
                      val stepY = 16
                      var y = 0
                      while (y < height) {
                          var x = 0
                          var prev = -1
                          while (x < width) {
                              val index = y * rowStride + x * pixelStride
                              if (index >= 0 && index < buffer.limit()) {
                                  val v = buffer.get(index).toInt() and 0xFF
                                  sum += v
                                  count++
                                  if (v >= 238) highlights++
                                  if (prev >= 0) {
                                      detailSum += kotlin.math.abs(v - prev)
                                  }
                                  prev = v
                              }
                              x += stepX
                          }
                          y += stepY
                      }
                      if (count > 0) {
                          val luma = sum.toFloat() / count.toFloat()
                          sceneLuma = luma
                          sceneHighlightPct =
                              highlights.toFloat() * 100f / count.toFloat()
                          sceneDetail =
                              detailSum.toFloat() /
                                  kotlin.math.max(1,count)
                          val signature =
                              (
                                  sceneLuma.toInt().toLong() shl 32
                              ) xor
                              (
                                  sceneHighlightPct
                                      .times(100f)
                                      .toInt()
                                      .toLong() shl 16
                              ) xor
                              sceneDetail
                                  .times(100f)
                                  .toInt()
                                  .toLong()

                          if (
                              previousFrameSignature != Long.MIN_VALUE &&
                              signature == previousFrameSignature
                          ) {
                              duplicateRun++
                              // Require consecutive identical sampled
                              // signatures to avoid flagging a merely static
                              // scene from one coincidental match.
                              if (duplicateRun >= 2) {
                                  duplicateFrames++
                                  duplicateStatus = "DUP"
                              }
                          } else {
                              duplicateRun = 0
                              if (duplicateFrames == 0L) {
                                  duplicateStatus = "CLEAR"
                                  jitterSamples = 0L
                                  jitterAbsSumNs = 0.0
                                  jitterMaxNs = 0L
                                  jitterRmsSumSq = 0.0
                                  pacingStatus = "WAIT"
                                  vfrStatus = "UNKNOWN"
                                  vfrDeviationFrames = 0L
                                  vfrTotalFrames = 0L
                                  vfrMinDurationNs = Long.MAX_VALUE
                                  vfrMaxDurationNs = 0L
                                  cfrOutputEnabled = true
                                  cfrOutputTarget = "30.000"
                                  cfrOutputStatus = "WAIT"
                                  exposureFrameStatus = "WAIT"
                                  exposureFrameRatio = 0.0
                                  exposureFrameViolations = 0L
                                  motionBlurBudget = 0.0
                                  motionBlurStatus = "WAIT"
                                  blurRiskFrames = 0L
                                  desiredShutterNs =
                                      FidelityEngine.SHUTTER_60_NS
                                  shutterEscalation = "1/60"
                                  shutterEscalations = 0L
                                  staticStableFrames = 0
                                  shutterRelaxation = "OFF"
                                  shutterRelaxations = 0L
                                  isoShutterPolicy = "BALANCED"
                                  isoNegotiations = 0L
                                  previousIsoPolicy = "BALANCED"
                                  isoCeilingState = "PREFERRED"
                                  isoSoftHits = 0L
                                  isoHardHits = 0L
                                  isoCriticalHits = 0L
                                  lowLightEscape = "OFF"
                                  lowLightEscapeCount = 0L
                                  highlightShutter = "OFF"
                                  highlightShutterCount = 0L
                                  faceMotionPriority = "OFF"
                                  faceMotionPriorityCount = 0L
                                  textureDetailPriority = "OFF"
                                  textureDetailPriorityCount = 0L
                                  structureDetailPriority = "OFF"
                                  structureDetailPriorityCount = 0L
                                  movementClass = "STATIC"
                                  panFrames = 0L
                                  walkFrames = 0L
                                  stabilizationState = "REQUESTED"
                                  stabilizationActiveFrames = 0L
                                  stabilizationOffFrames = 0L
                                  antiFlicker50 = "AUTO"
                                  antiFlicker50Count = 0L
                                  antiFlicker60 = "AVAILABLE"
                                  antiFlicker60Count = 0L
                                  autoFlickerState = "LEARNING"
                                  flickerSamples = 0
                                  flickerAlternations = 0
                                  lastLumaDelta = 0f
                                  autoFlickerEvents = 0L
                                  shutterRequestStatus = "WAIT"
                                  shutterRequestErrorPct = 0.0
                                  shutterRequestPassFrames = 0L
                                  shutterRequestMissFrames = 0L
                                  fpsRequestStatus = "WAIT"
                                  fpsRequestError = 0.0
                                  fpsRequestMatchSamples = 0L
                                  fpsRequestMissSamples = 0L
                                  appliedShutterTargetNs =
                                      FidelityEngine.SHUTTER_60_NS
                                  shutterRampStatus = "STABLE"
                                  shutterRampFrames = 0
                                  shutterRampEvents = 0L
                                  pendingShutterTargetNs =
                                      FidelityEngine.SHUTTER_60_NS
                                  pendingShutterFrames = 0
                                  hysteresisState = "HOLD"
                                  hysteresisSwitches = 0L
                                  previousSceneLuma = -1f
                                  previousSceneDetail = -1f
                                  sceneChangeState = "STABLE"
                                  sceneChangeCooldown = 0
                                  sceneChangeEvents = 0L
                                  lightRecoveryState = "STABLE"
                                  lightRecoveryFrames = 0
                                  lightRecoveryEvents = 0L
                                  afAeCoordination = "AUTO"
                                  afAeSettleFrames = 0
                                  afAeEvents = 0L
                                  aeLockCoordination = "AUTO"
                                  aeStableFrames = 0
                                  aeLockEvents = 0L
                              }
                          }
                          previousFrameSignature = signature
                          if (
                              previousSceneLuma >= 0f &&
                              previousSceneDetail >= 0f
                          ) {
                              val lumaDelta =
                                  kotlin.math.abs(
                                      sceneLuma - previousSceneLuma
                                  )
                              val detailDelta =
                                  kotlin.math.abs(
                                      sceneDetail - previousSceneDetail
                                  )
                              if (
                                  sceneChangeCooldown <= 0 &&
                                  (
                                      lumaDelta >=
                                          FidelityEngine.SCENE_CHANGE_LUMA_DELTA ||
                                      detailDelta >=
                                          FidelityEngine.SCENE_CHANGE_DETAIL_DELTA
                                  )
                              ) {
                                  sceneChangeState = "CHANGE"
                                  sceneChangeEvents++
                                  sceneChangeCooldown =
                                      FidelityEngine.SCENE_CHANGE_COOLDOWN_FRAMES
                                  // Reset short-term control history so the
                                  // new scene is evaluated cleanly.
                                  pendingShutterFrames = 0
                                  staticStableFrames = 0
                                  flickerSamples = 0
                                  flickerAlternations = 0
                              } else if (sceneChangeCooldown > 0) {
                                  sceneChangeCooldown--
                                  sceneChangeState = "SETTLING"
                              } else {
                                  sceneChangeState = "STABLE"
                              }
                          }
                          if (previousSceneLuma >= 0f) {
                              val lightJump =
                                  kotlin.math.abs(
                                      sceneLuma - previousSceneLuma
                                  )
                              if (
                                  lightJump >=
                                  FidelityEngine.LIGHT_JUMP_LUMA_DELTA
                              ) {
                                  lightRecoveryState = "RECOVER"
                                  lightRecoveryFrames =
                                      FidelityEngine.LIGHT_RECOVERY_FRAMES
                                  lightRecoveryEvents++
                                  // Release stale static/ISO assumptions
                                  // immediately after a major light jump.
                                  staticStableFrames = 0
                                  pendingShutterFrames = 0
                              } else if (lightRecoveryFrames > 0) {
                                  lightRecoveryFrames--
                                  lightRecoveryState = "SETTLING"
                              } else {
                                  lightRecoveryState = "STABLE"
                              }
                          }
                          previousSceneLuma = sceneLuma
                          previousSceneDetail = sceneDetail
                          temporalDecision =
                              multiFrameEngine.push(
                                  TemporalFrameState(
                                      image.imageInfo.timestamp,
                                      sceneLuma,
                                      sceneDetail,
                                      sceneMotion
                                  )
                              )
                          if (previousLuma >= 0f) {
                              val delta =
                                  kotlin.math.abs(luma - previousLuma)
                              sceneMotion =
                                  sceneMotion * 0.82f + delta * 0.18f
                          }
                          if (previousLuma >= 0f) {
                              val delta = luma - previousLuma
                              if (
                                  kotlin.math.abs(delta) >= 2.0f &&
                                  kotlin.math.abs(lastLumaDelta) >= 2.0f &&
                                  delta * lastLumaDelta < 0f
                              ) {
                                  flickerAlternations++
                              }
                              flickerSamples++
                              lastLumaDelta = delta

                              if (flickerSamples >= 12) {
                                  val ratio =
                                      flickerAlternations.toFloat() /
                                      flickerSamples.toFloat()
                                  val before = autoFlickerState
                                  autoFlickerState =
                                      when {
                                          ratio >= 0.55f -> "FLICKER LIKELY"
                                          ratio >= 0.30f -> "WATCH"
                                          else -> "CLEAR"
                                      }
                                  if (
                                      autoFlickerState == "FLICKER LIKELY" &&
                                      before != autoFlickerState
                                  ) {
                                      autoFlickerEvents++
                                  }
                                  if (flickerSamples >= 30) {
                                      flickerSamples = 0
                                      flickerAlternations = 0
                                  }
                              }
                          }
                          previousLuma = luma
                          runOnUiThread { updateQualityHud() }
                      }
                  } finally {
                      image.close()
                  }
              }

              private fun buildAnalysis(): ImageAnalysis =
                  ImageAnalysis.Builder()
                      .setTargetResolution(Size(640,480))
                      .setBackpressureStrategy(
                          ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST
                      )
                      .build()
                      .also {
                          it.setAnalyzer(
                              analysisExecutor
                          ) { frame ->
                              analyzeFrame(frame)
                          }
                      }

              private fun startCamera() {
                  statusView.text = "OPENING CAMERA…"
                  val future = ProcessCameraProvider.getInstance(this)

                  future.addListener(
                      {
                          val provider = future.get()
                          cameraProvider = provider
                          provider.unbindAll()

                          val selector =
                              if (frontCamera) {
                                  CameraSelector.DEFAULT_FRONT_CAMERA
                              } else {
                                  FidelitySceneIntelligence.chooseBackLens(
                                      provider.availableCameraInfos
                                  )
                              }

                          val previewBuilder = Preview.Builder()
                          runCatching {
                              Camera2Interop.Extender(previewBuilder)
                                  .setCaptureRequestOption(
                                      CaptureRequest.EDGE_MODE,
                                      CaptureRequest.EDGE_MODE_FAST
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.NOISE_REDUCTION_MODE,
                                      CaptureRequest.NOISE_REDUCTION_MODE_FAST
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_AF_MODE,
                                      CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_VIDEO
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE,
                                      CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_AE_ANTIBANDING_MODE,
                                      CaptureRequest.CONTROL_AE_ANTIBANDING_MODE_50HZ
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE,
                                      Range(60, 60)
                                  )
                                  .setSessionCaptureCallback(
                                      object : android.hardware.camera2.CameraCaptureSession.CaptureCallback() {
                                          override fun onCaptureCompleted(
                                              session: android.hardware.camera2.CameraCaptureSession,
                                              request: android.hardware.camera2.CaptureRequest,
                                              result: android.hardware.camera2.TotalCaptureResult
                                          ) {
                                              actualIso = result.get(CaptureResult.SENSOR_SENSITIVITY)
                                              if (recording != null) {
                                                  actualIso?.let { iso ->
                                                      if (iso > 0) {
                                                          isoSampleCount++
                                                          isoSampleSum += iso.toLong()
                                                          isoMin = minOf(isoMin,iso)
                                                          isoMax = maxOf(isoMax,iso)
                                                      }
                                                  }
                                              }
                                              actualExposureNs = result.get(CaptureResult.SENSOR_EXPOSURE_TIME)
                                              if (recording != null) {
                                                  actualExposureNs?.let { ns ->
                                                      if (ns > 0L) {
                                                          shutterSampleCount++
                                                          shutterSampleSumNs += ns.toDouble()
                                                          shutterMinNs = minOf(shutterMinNs,ns)
                                                          shutterMaxNs = maxOf(shutterMaxNs,ns)
                                                      }
                                                  }
                                              }
                                              shutter60Status =
                                                  actualExposureNs?.let { ns ->
                                                      if (
                                                          kotlin.math.abs(
                                                              ns -
                                                              FidelityEngine.SHUTTER_60_NS
                                                          ) <=
                                                          FidelityEngine.SHUTTER_60_TOLERANCE_NS
                                                      ) {
                                                          "1/60 LOCK"
                                                      } else if (
                                                          ns >
                                                          FidelityEngine.SHUTTER_60_NS
                                                      ) {
                                                          "SLOW"
                                                      } else {
                                                          "FAST"
                                                      }
                                                  } ?: "WAIT"
                                              shutterWindow =
                                                  actualExposureNs?.let { ns ->
                                                      when {
                                                          ns <= FidelityEngine.SHUTTER_MOTION_NS ->
                                                              "MOTION 1/120+"
                                                          ns <= FidelityEngine.SHUTTER_DETAIL_NS ->
                                                              "DETAIL 1/80+"
                                                          ns <= 20_000_000L ->
                                                              "BASE ~1/60"
                                                          ns <= FidelityEngine.SHUTTER_SLOW_NS ->
                                                              "LOW LIGHT 1/30-1/50"
                                                          else -> "BLUR RISK"
                                                      }
                                                  } ?: "WAIT"
                                              val antiBand =
                                                  result.get(
                                                      CaptureResult.CONTROL_AE_ANTIBANDING_MODE
                                                  )
                                              antiFlicker50 =
                                                  when (antiBand) {
                                                      CaptureResult.CONTROL_AE_ANTIBANDING_MODE_50HZ ->
                                                          "50HZ ACTIVE"
                                                      CaptureResult.CONTROL_AE_ANTIBANDING_MODE_AUTO ->
                                                          "AUTO"
                                                      CaptureResult.CONTROL_AE_ANTIBANDING_MODE_OFF ->
                                                          "OFF"
                                                      else -> "OTHER"
                                                  }
                                              if (antiFlicker50 == "50HZ ACTIVE") {
                                                  antiFlicker50Count++
                                              }
                                              antiFlicker60 =
                                                  if (
                                                      antiBand ==
                                                      CaptureResult.CONTROL_AE_ANTIBANDING_MODE_60HZ
                                                  ) "60HZ ACTIVE"
                                                  else "AVAILABLE"
                                              if (antiFlicker60 == "60HZ ACTIVE") {
                                                  antiFlicker60Count++
                                              }

                                              val stab =
                                                  result.get(
                                                      CaptureResult.CONTROL_VIDEO_STABILIZATION_MODE
                                                  )
                                              stabilizationState =
                                                  when (stab) {
                                                      CaptureResult.CONTROL_VIDEO_STABILIZATION_MODE_ON -> {
                                                          stabilizationActiveFrames++
                                                          "ACTIVE"
                                                      }
                                                      CaptureResult.CONTROL_VIDEO_STABILIZATION_MODE_OFF -> {
                                                          stabilizationOffFrames++
                                                          "OFF"
                                                      }
                                                      else -> "UNKNOWN"
                                                  }
                                              actualAfState = result.get(CaptureResult.CONTROL_AF_STATE)
                                              if (lensSwitchSettleFrames > 0) {
                                                  lensSwitchSettleFrames--
                                                  val oldProxy =
                                                      preSwitchExposureNs.toDouble() *
                                                      preSwitchIso.toDouble()
                                                  val newProxy =
                                                      (actualExposureNs ?: 0L).toDouble() *
                                                      (actualIso ?: 0).toDouble()
                                                  val delta =
                                                      if (oldProxy > 0.0 && newProxy > 0.0) {
                                                          kotlin.math.abs(newProxy-oldProxy) / oldProxy
                                                      } else 0.0
                                                  lensExposureState =
                                                      if (
                                                          delta >
                                                          FidelityEngine.LENS_EXPOSURE_DELTA_WARN
                                                      ) "MATCHING" else "CONTINUOUS"
                                              } else if (lensExposureState != "STABLE") {
                                                  lensExposureState = "STABLE"
                                              }
                                              val aeNow =
                                                  result.get(
                                                      CaptureResult.CONTROL_AE_STATE
                                                  )
                                              val afNow = actualAfState
                                              val afUnsettled =
                                                  afNow ==
                                                      CaptureResult.CONTROL_AF_STATE_ACTIVE_SCAN ||
                                                  afNow ==
                                                      CaptureResult.CONTROL_AF_STATE_PASSIVE_SCAN ||
                                                  afNow ==
                                                      CaptureResult.CONTROL_AF_STATE_NOT_FOCUSED_LOCKED
                                              if (afUnsettled) {
                                                  if (afAeCoordination != "AF SETTLING") {
                                                      afAeEvents++
                                                  }
                                                  afAeCoordination = "AF SETTLING"
                                                  afAeSettleFrames =
                                                      FidelityEngine.AF_AE_SETTLE_FRAMES
                                              } else if (afAeSettleFrames > 0) {
                                                  afAeSettleFrames--
                                                  afAeCoordination = "AE HOLD"
                                              } else {
                                                  afAeCoordination = "COORDINATED"
                                              }
                                              val aeConverged =
                                                  aeNow ==
                                                      CaptureResult.CONTROL_AE_STATE_CONVERGED ||
                                                  aeNow ==
                                                      CaptureResult.CONTROL_AE_STATE_LOCKED
                                              if (
                                                  aeConverged &&
                                                  sceneMotion <=
                                                      FidelityEngine.AE_LOCK_MOTION_MAX &&
                                                  lightRecoveryState == "STABLE"
                                              ) {
                                                  aeStableFrames++
                                              } else {
                                                  aeStableFrames = 0
                                              }
                                              val beforeAeLock =
                                                  aeLockCoordination
                                              aeLockCoordination =
                                                  when {
                                                      aeNow ==
                                                          CaptureResult.CONTROL_AE_STATE_LOCKED ->
                                                          "LOCKED"
                                                      aeStableFrames >=
                                                          FidelityEngine.AE_LOCK_STABLE_FRAMES ->
                                                          "LOCK READY"
                                                      lightRecoveryState != "STABLE" ->
                                                          "RELEASE"
                                                      else -> "AUTO"
                                                  }
                                              if (
                                                  beforeAeLock !=
                                                  aeLockCoordination
                                              ) {
                                                  aeLockEvents++
                                              }
                                              if (recording != null) {
                                                  actualIso?.let {
                                                      takeMinIso = minOf(takeMinIso,it)
                                                      takeMaxIso = maxOf(takeMaxIso,it)
                                                  }
                                                  actualExposureNs?.let {
                                                      takeMinExposureNs =
                                                          minOf(takeMinExposureNs,it)
                                                      takeMaxExposureNs =
                                                          maxOf(takeMaxExposureNs,it)
                                                  }
                                                  when (actualAfState) {
                                                      CaptureResult.CONTROL_AF_STATE_FOCUSED_LOCKED,
                                                      CaptureResult.CONTROL_AF_STATE_PASSIVE_FOCUSED ->
                                                          takeFocusGood++
                                                      CaptureResult.CONTROL_AF_STATE_NOT_FOCUSED_LOCKED,
                                                      CaptureResult.CONTROL_AF_STATE_PASSIVE_UNFOCUSED ->
                                                          takeFocusBad++
                                                  }
                                              }
                                              runOnUiThread { updateQualityHud() }
                                          }
                                      }
                                  )
                          }

                          val preview =
                              previewBuilder
                                  .build()
                                  .also {
                                      it.setSurfaceProvider(
                                          previewView.surfaceProvider
                                      )
                                  }

                          // Keep V1's proven CameraX binding path. The
                          // QualitySelector itself performs capability fallback;
                          // do not call a provider CameraInfo API that is not
                          // available in this CameraX version.
                          activeQualityLabel = "1080 TARGET • AUTO FALLBACK"

                          val recorder =
                              Recorder.Builder()
                                  .setQualitySelector(
                                      FidelityEngine.qualitySelector()
                                  )
                                  .build()

                          val videoBuilder = VideoCapture.Builder(recorder)
                          runCatching {
                              Camera2Interop.Extender(videoBuilder)
                                  .setCaptureRequestOption(
                                      CaptureRequest.EDGE_MODE,
                                      CaptureRequest.EDGE_MODE_FAST
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.NOISE_REDUCTION_MODE,
                                      CaptureRequest.NOISE_REDUCTION_MODE_FAST
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_AF_MODE,
                                      CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_VIDEO
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE,
                                      CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE,
                                      Range(60, 60)
                                  )
                          }
                          videoCapture = videoBuilder.build()

                          val analysis =
                              if (analysisEnabled) buildAnalysis()
                              else null

                          val bound =
                              runCatching {
                                  if (analysis != null) {
                                      provider.bindToLifecycle(
                                          this,
                                          selector,
                                          preview,
                                          videoCapture,
                                          analysis
                                      )
                                  } else {
                                      provider.bindToLifecycle(
                                          this,
                                          selector,
                                          preview,
                                          videoCapture
                                      )
                                  }
                              }.recoverCatching {
                                  // Analysis must never cost us recording.
                                  analysisEnabled = false
                                  recordingFallback = "VIDEO + NO ANALYSIS"
                                  recordingFallbackEvents++
                                  provider.unbindAll()
                                  provider.bindToLifecycle(
                                      this,
                                      selector,
                                      preview,
                                      videoCapture
                                  )
                              }

                          bound.onSuccess {
                              camera = it
                              runCatching {
                                  val c2 =
                                      androidx.camera.camera2.interop.Camera2CameraInfo
                                          .from(it.cameraInfo)
                                  val expRange =
                                      c2.getCameraCharacteristic(
                                          CameraCharacteristics.SENSOR_INFO_EXPOSURE_TIME_RANGE
                                      )
                                  val isoRange =
                                      c2.getCameraCharacteristic(
                                          CameraCharacteristics.SENSOR_INFO_SENSITIVITY_RANGE
                                      )
                                  exposureRangeLabel =
                                      expRange?.let { r ->
                                          "${r.lower}-${r.upper}"
                                      } ?: "UNKNOWN"
                                  isoRangeLabel =
                                      isoRange?.let { r ->
                                          "${r.lower}-${r.upper}"
                                      } ?: "UNKNOWN"
                                  capabilityState =
                                      if (expRange != null && isoRange != null)
                                          "NEGOTIATED"
                                      else "LIMITED"
                                  val oldControl = controlFallback
                                  controlFallback =
                                      if (expRange != null && isoRange != null)
                                          "CAPABILITY READY"
                                      else "AE AUTO"
                                  if (oldControl != controlFallback) {
                                      controlFallbackEvents++
                                  }
                              }.onFailure {
                                  capabilityState = "UNKNOWN"
                                  controlFallback = "AE AUTO"
                                  controlFallbackEvents++
                              }
                              statusView.text =
                                  "READY • ${FidelityEngine.NAME} • $activeQualityLabel • SOURCE DETAIL"
                              updateQualityHud()
                          }.onFailure {
                              statusView.text =
                                  "CAMERA UNAVAILABLE • ${it.javaClass.simpleName}"
                          }
                      },
                      ContextCompat.getMainExecutor(this)
                  )
              }

              private fun updateQualityHud() {
                  val exposure =
                      camera?.cameraInfo?.exposureState
                          ?.exposureCompensationIndex ?: 0
                  val q =
                      FidelitySceneIntelligence.classify(
                          exposureIndex = exposure,
                          recording = recording != null,
                          focusLocked = focusTouched
                      )
                  val exposureMs = actualExposureNs?.div(1_000_000.0)
                  val focusState =
                      when (actualAfState) {
                          CaptureResult.CONTROL_AF_STATE_FOCUSED_LOCKED,
                          CaptureResult.CONTROL_AF_STATE_PASSIVE_FOCUSED -> "GOOD"
                          CaptureResult.CONTROL_AF_STATE_NOT_FOCUSED_LOCKED,
                          CaptureResult.CONTROL_AF_STATE_PASSIVE_UNFOCUSED -> "CHECK"
                          else -> q.focus
                      }
                  captureProfile =
                      if ((actualIso ?: 0) >= 800) "LOW LIGHT"
                      else "REFERENCE"
                  val iso = actualIso ?: 0
                  val blurRisk =
                      (actualExposureNs ?: 0L) > 20_000_000L
                  val director =
                      when {
                          focusState == "CHECK" -> "REFOCUS"
                          iso >= 1200 -> "HIGH ISO"
                          sceneHighlightPct >= 6f -> "HIGHLIGHT RISK"
                          blurRisk || sceneMotion >= 4.5f -> "BLUR RISK"
                          else -> "READY"
                      }
                  captureProfile =
                      when {
                          iso >= 800 || sceneLuma < 55f -> "LOW LIGHT"
                          blurRisk || sceneMotion >= 4.5f -> "MOTION"
                          sceneDetail >= 12f -> "DETAIL"
                          else -> "REFERENCE"
                      }
                  fidelityFeedbackProfile =
                      when {
                          motionBlurStatus == "BLUR RISK" ->
                              "MOTION SAFE"
                          isoCeilingState == "CRITICAL" ||
                              isoCeilingState == "HARD" ->
                              "NOISE SAFE"
                          sceneHighlightPct >=
                              FidelityEngine.HIGHLIGHT_CLIP_HIGH_PCT ->
                              "HIGHLIGHT SAFE"
                          sceneDetail >=
                              FidelityEngine.STRUCTURE_DETAIL_TRIGGER ->
                              "DETAIL"
                          else -> captureProfile
                      }
                  fidelityFeedbackStrength =
                      when (fidelityFeedbackProfile) {
                          "MOTION SAFE" -> 0.72f
                          "NOISE SAFE" -> 0.64f
                          "HIGHLIGHT SAFE" -> 0.82f
                          "DETAIL" -> 1.12f
                          else -> 1.0f
                      }
                  fidelityFeedbackReason =
                      "BLUR=$motionBlurStatus," +
                      "ISO=$isoCeilingState," +
                      "CLIP=" +
                      String.format(
                          Locale.US,
                          "%.1f",
                          sceneHighlightPct
                      )
                  val lab =
                      FidelityQualityLab.state(
                          exposureNs = actualExposureNs,
                          iso = actualIso,
                          enhancementPresent = enhancementState.apiPresent,
                          analysisActive = analysisEnabled
                      )
                  val shutterHud =
                      actualExposureNs?.let { ns ->
                          if (ns > 0L)
                              "1/" + String.format(
                                  Locale.US,
                                  "%.0f",
                                  1_000_000_000.0/ns.toDouble()
                              )
                          else "--"
                      } ?: "--"
                  val blurWarning =
                      when (motionBlurStatus) {
                          "BLUR RISK" -> "MOTION BLUR RISK"
                          "WATCH" -> "MOTION BLUR WATCH"
                          "SHARP" -> "MOTION BLUR CLEAR"
                          else -> "MOTION BLUR --"
                      }
                  if (
                      blurWarning != lastBlurWarning &&
                      motionBlurStatus == "BLUR RISK"
                  ) {
                      blurWarningEvents++
                  }
                  lastBlurWarning = blurWarning

                  frameDropWarning =
                      when {
                          droppedFrames > previousDroppedFramesForWarning -> {
                              frameDropWarningEvents++
                              "FRAME DROP"
                          }
                          encoderLoadState == "CRITICAL" ->
                              "FRAME DROP RISK"
                          encoderLoadState == "HIGH" ->
                              "FRAME DROP WATCH"
                          else -> "FRAME DROP CLEAR"
                      }
                  previousDroppedFramesForWarning =
                      droppedFrames

                  val isoNowForWarning = actualIso ?: 0
                  highIsoWarning =
                      when {
                          isoNowForWarning >= FidelityEngine.ISO_CRITICAL ->
                              "ISO CRITICAL"
                          isoNowForWarning >= FidelityEngine.ISO_HARD_WARNING ->
                              "HIGH ISO"
                          isoNowForWarning >= FidelityEngine.ISO_SOFT_MAX ->
                              "ISO WATCH"
                          else -> "ISO CLEAR"
                      }
                  if (
                      highIsoWarning != previousHighIsoWarning &&
                      (
                          highIsoWarning == "HIGH ISO" ||
                          highIsoWarning == "ISO CRITICAL"
                      )
                  ) {
                      highIsoWarningEvents++
                  }
                  previousHighIsoWarning = highIsoWarning

                  flickerRiskWarning =
                      when {
                          autoFlickerState == "FLICKER LIKELY" ->
                              "FLICKER RISK"
                          autoFlickerState == "WATCH" ->
                              "FLICKER WATCH"
                          antiFlicker50 == "50HZ ACTIVE" ||
                              antiFlicker60 == "60HZ ACTIVE" ->
                              "FLICKER PROTECTED"
                          else -> "FLICKER CLEAR"
                      }
                  if (
                      flickerRiskWarning !=
                          previousFlickerRiskWarning &&
                      flickerRiskWarning == "FLICKER RISK"
                  ) {
                      flickerRiskWarningEvents++
                  }
                  previousFlickerRiskWarning =
                      flickerRiskWarning

                  warningHud.text =
                      blurWarning + " • " +
                      frameDropWarning + " • " +
                      highIsoWarning + " • " +
                      flickerRiskWarning
                  captureHud.text =
                      String.format(
                          Locale.US,
                          "%.3f FPS • SHUTTER %s • ISO %d",
                          if (rollingFps > 0.0) rollingFps else 60.0,
                          shutterHud,
                          actualIso ?: 0
                      )
                  qualityHud.text =
                      "$director • FOCUS $focusState • ISO $iso • EXP " +
                      (exposureMs?.let {
                          String.format(Locale.US,"%.1fms",it)
                      } ?: "--") +
                      " • $captureProfile • " +
                      "Y " + String.format(Locale.US,"%.0f",sceneLuma) +
                      " • CLIP " +
                      String.format(Locale.US,"%.1f%%",sceneHighlightPct) +
                      " • DETAIL " +
                      String.format(Locale.US,"%.1f",sceneDetail) +
                      " • " + enhancementState.label +
                      " • SHUTTER " + lab.shutter +
                      " • ISO " + lab.isoCeiling +
                      " • REF " + lab.referenceCalibration +
                      " • FPS " +
                      String.format(Locale.US,"%.2f",measuredFps30) +
                      " • MODE " + fpsCompatibility +
                      " • FRAME " + frameDurationStatus +
                      " • SHUTTER " + shutter60Status +
                      " • WINDOW " + shutterWindow +
                      " • LIVEFPS " +
                      String.format(Locale.US,"%.2f",rollingFps) +
                      " • DROP " + droppedFrames +
                      " • DUP " + duplicateFrames +
                      " • PACE " + pacingStatus +
                      " • VFR " + vfrStatus +
                      " • CFR " + cfrOutputStatus +
                      " • EXP/FRAME " + exposureFrameStatus +
                      " • BLUR " + motionBlurStatus +
                      " • WANT " + shutterEscalation +
                      " • RELAX " + shutterRelaxation +
                      " • ISO/SH " + isoShutterPolicy +
                      " • ISO CAP " + isoCeilingState +
                      " • LL " + lowLightEscape +
                      " • HL " + highlightShutter +
                      " • FACE " + faceMotionPriority +
                      " • TEX " + textureDetailPriority +
                      " • STRUCT " + structureDetailPriority +
                      " • MOVE " + movementClass +
                      " • STAB " + stabilizationState +
                      " • 50HZ " + antiFlicker50 +
                      " • 60HZ " + antiFlicker60 +
                      " • FLICKER " + autoFlickerState +
                      " • SHREQ " + shutterRequestStatus +
                      " • FPSREQ " + fpsRequestStatus +
                      " • RAMP " + shutterRampStatus +
                      " • HYS " + hysteresisState +
                      " • SCENE " + sceneChangeState +
                      " • LIGHT " + lightRecoveryState +
                      " • AF/AE " + afAeCoordination +
                      " • AELOCK " + aeLockCoordination +
                      " • LENS-EV " + lensExposureState +
                      " • THERM " + thermalState +
                      " • ENC " + encoderLoadState +
                      " • LOSS " + frameLossProtection +
                      " • REC " + recordingFallback +
                      " • CAP " + capabilityState +
                      " • CTRL " + controlFallback +
                      " • FID " + fidelityFeedbackProfile +
                      " • TEMP " + temporalDecision.profile +
                      " • 60FPS " + fps60Status +
                      " • MODE " + fps60Compatibility
              }

              private fun toggleRecording() {
                  val capture = videoCapture ?: run {
                      statusView.text = "CAMERA STILL STARTING"
                      return
                  }

                  if (recording != null) {
                      statusView.text = "SAVING CLEAN MASTER…"
                      recordButton.isEnabled = false
                      recording?.stop()
                      return
                  }

                  val displayName =
                      "FIDELITY_ORIGINAL_" +
                          SimpleDateFormat(
                              "yyyyMMdd_HHmmss",
                              Locale.US
                          ).format(Date()) +
                          ".mp4"

                  val values =
                      ContentValues().apply {
                          put(
                              MediaStore.Video.Media.DISPLAY_NAME,
                              displayName
                          )
                          put(
                              MediaStore.Video.Media.MIME_TYPE,
                              "video/mp4"
                          )
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(
                                  MediaStore.Video.Media.RELATIVE_PATH,
                                  "Movies/FidelityCam"
                              )
                          }
                      }

                  val output =
                      MediaStoreOutputOptions.Builder(
                          contentResolver,
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                      )
                          .setContentValues(values)
                          .build()

                  var pending =
                      capture.output.prepareRecording(this, output)

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) == PackageManager.PERMISSION_GRANTED
                  ) {
                      pending = pending.withAudioEnabled()
                  }

                  recording =
                      pending.start(
                          ContextCompat.getMainExecutor(this)
                      ) { event ->
                          when (event) {
                              is VideoRecordEvent.Start -> {
                                  measuredFps60 = 0.0
                                  fps60Status = "WAIT"
                                  fps60Compatibility = "60.000"
                                  multiFrameEngine.reset()
                                  temporalDecision = TemporalDecision(0,0f,0f,1f,"WARMUP")
                                  blurRiskTimeNs = 0L
                                  blurWatchTimeNs = 0L
                                  blurClearTimeNs = 0L
                                  isoSampleCount = 0L
                                  isoSampleSum = 0L
                                  isoMin = Int.MAX_VALUE
                                  isoMax = 0
                                  shutterSampleCount = 0L
                                  shutterSampleSumNs = 0.0
                                  shutterMinNs = Long.MAX_VALUE
                                  shutterMaxNs = 0L
                                  fpsFrames = 0L
                                  fpsFirstNs = 0L
                                  fpsLastNs = 0L
                                  measuredFps30 = 0.0
                                  fpsCompatibility = "30.000"
                                  actualFrameDurationNs = 0L
                                  frameDurationStatus = "WAIT"
                                  shutter60Status = "WAIT"
                                  shutterWindow = "BASE 1/60"
                                  fpsWindowNs.fill(0L)
                                  fpsWindowCount = 0
                                  fpsWindowIndex = 0
                                  rollingFps = 0.0
                                  minObservedFps = Double.MAX_VALUE
                                  maxObservedFps = 0.0
                                  droppedFrames = 0L
                                  longestFrameGapNs = 0L
                                  dropStatus = "CLEAR"
                                  duplicateFrames = 0L
                                  previousFrameSignature = Long.MIN_VALUE
                                  duplicateRun = 0
                                  duplicateStatus = "CLEAR"
                                  takeMinIso = Int.MAX_VALUE
                                  takeMaxIso = 0
                                  takeMinExposureNs = Long.MAX_VALUE
                                  takeMaxExposureNs = 0L
                                  takeFocusGood = 0
                                  takeFocusBad = 0
                                  recordButton.text = "■ STOP"
                                  recordButton.isEnabled = true
                                  lensButton.isEnabled = false
                                  exposureButton.isEnabled = false
                                  fidelityButton.isEnabled = false
                                  statusView.text =
                                      "● REC • $activeQualityLabel • V6 FIDELITY IMAGE CLEAN"
                              }

                              is VideoRecordEvent.Finalize -> {
                                  recording = null
                                  recordButton.text = "● REC"
                                  recordButton.isEnabled = true
                                  lensButton.isEnabled = true
                                  exposureButton.isEnabled = true
                                  fidelityButton.isEnabled = true

                                  statusView.text =
                                      if (event.hasError()) {
                                          "SAVE ERROR • ${event.error}"
                                      } else {
                                          "ORIGINAL SAVED • BUILDING COMPRESSED COPY"
                                      }

                                  if (!event.hasError()) {
                                      processFidelityImage(
                                          event.outputResults.outputUri
                                      )
                                  }
                              }
                          }
                      }
              }

              private fun processFidelityImage(cleanUri: android.net.Uri) {
                  val cache =
                      File(cacheDir, "fidelity_v6").apply { mkdirs() }
                  val temp =
                      File(
                          cache,
                          "FIDELITY_${System.currentTimeMillis()}.mp4"
                      )
                  if (temp.exists()) temp.delete()

                  // V6 R5 MOTION DETAIL: stable 30fps AE target, restrained processing, no social compression.
                  // This modifies the pixels in the second render; CLEAN is read-only.
                  val videoEffects =
                      listOf(
                          FidelityAdaptiveEffect(
                              strength =
                                  fidelityFeedbackStrength
                          )
                      )

                  val edited =
                      EditedMediaItem.Builder(
                          MediaItem.Builder()
                              .setUri(cleanUri)
                              .build()
                      )
                          .setEffects(
                              Effects(
                                  emptyList(),
                                  videoEffects
                              )
                          )
                          .build()


                  val encoderFactory =
                      DefaultEncoderFactory.Builder(this)
                          .setRequestedVideoEncoderSettings(
                              VideoEncoderSettings.Builder()
                                  .setBitrate(12_000_000)
                                  .setiFrameIntervalSeconds(2f)
                                  .build()
                          )
                          .build()

                  fidelityTransformer =
                      Transformer.Builder(this)
                          .setEncoderFactory(encoderFactory)
                          .setVideoMimeType(MimeTypes.VIDEO_H264)
                          .setAudioMimeType(MimeTypes.AUDIO_AAC)
                          .addListener(
                              object : Transformer.Listener {
                                  override fun onCompleted(
                                      mediaItem: MediaItem,
                                      result: ExportResult
                                  ) {
                                      publishFidelityImage(temp)
                                      fidelityTransformer = null
                                      temp.delete()
                                  }

                                  override fun onError(
                                      mediaItem: MediaItem,
                                      result: ExportResult,
                                      exception: ExportException
                                  ) {
                                      fidelityTransformer = null
                                      temp.delete()
                                      runOnUiThread {
                                          statusView.text =
                                              "ORIGINAL SAFE • COMPRESSED FAILED"
                                      }
                                  }
                              }
                          )
                          .build()
                          .also {
                              it.start(
                                  edited,
                                  temp.absolutePath
                              )
                          }
              }

              private fun publishFidelityImage(temp: File) {
                  if (!temp.exists() || temp.length() <= 0L) {
                      runOnUiThread {
                          statusView.text =
                              "ORIGINAL SAFE • COMPRESSED EMPTY"
                      }
                      return
                  }

                  val name =
                      "FIDELITY_COMPRESSED_" +
                          SimpleDateFormat(
                              "yyyyMMdd_HHmmss",
                              Locale.US
                          ).format(Date()) +
                          ".mp4"

                  val values =
                      ContentValues().apply {
                          put(
                              MediaStore.Video.Media.DISPLAY_NAME,
                              name
                          )
                          put(
                              MediaStore.Video.Media.MIME_TYPE,
                              "video/mp4"
                          )
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(
                                  MediaStore.Video.Media.RELATIVE_PATH,
                                  "Movies/FidelityCam/Compressed"
                              )
                              put(
                                  MediaStore.Video.Media.IS_PENDING,
                                  1
                              )
                          }
                      }

                  val uri =
                      contentResolver.insert(
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                          values
                      )

                  if (uri == null) {
                      runOnUiThread {
                          statusView.text =
                              "ORIGINAL SAFE • COMPRESSED PUBLISH FAILED"
                      }
                      return
                  }

                  runCatching {
                      contentResolver
                          .openOutputStream(uri, "w")
                          ?.use { output ->
                              FileInputStream(temp).use { input ->
                                  input.copyTo(output, 1024 * 1024)
                              }
                          }
                          ?: error("Output stream unavailable")

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          contentResolver.update(
                              uri,
                              ContentValues().apply {
                                  put(
                                      MediaStore.Video.Media.IS_PENDING,
                                      0
                                  )
                              },
                              null,
                              null
                          )
                      }
                  }.onSuccess {
                      publishTakeReport()
                      val captureScore =
                          (
                              100f -
                              sceneHighlightPct * 2f -
                              kotlin.math.min(35f,sceneMotion * 2f) +
                              kotlin.math.min(20f,sceneDetail)
                          ).coerceIn(0f,100f)
                      runOnUiThread {
                          qualityHud.text =
                              qualityHud.text.toString() +
                              " • CAPTURE SCORE " +
                              String.format(Locale.US,"%.0f",captureScore)
                          statusView.text =
                              "17.2/53.2 COMPLETE • 60/59.94 FPS • ORIGINAL + COMPRESSED"
                      }
                  }.onFailure {
                      runCatching {
                          contentResolver.delete(uri, null, null)
                      }
                      runOnUiThread {
                          statusView.text =
                              "CLEAN SAFE • FIDELITY PUBLISH FAILED"
                      }
                  }
              }

              private fun publishTakeReport() {
                  val focusTotal = takeFocusGood + takeFocusBad
                  val focusPct =
                      if (focusTotal > 0) {
                          (takeFocusGood * 100) / focusTotal
                      } else 0
                  val minIso =
                      if (takeMinIso == Int.MAX_VALUE) 0 else takeMinIso
                  val minExpMs =
                      if (takeMinExposureNs == Long.MAX_VALUE) 0.0
                      else takeMinExposureNs / 1_000_000.0
                  val maxExpMs =
                      takeMaxExposureNs / 1_000_000.0
                  val report =
                      buildString {
                          appendLine("FIDELITY V13 TAKE QUALITY REPORT")
                          appendLine("PROFILE=$captureProfile")
                          appendLine("ISO_MIN=$minIso")
                          appendLine("ISO_MAX=$takeMaxIso")
                          appendLine(
                              "EXPOSURE_MIN_MS=" +
                                  String.format(Locale.US,"%.2f",minExpMs)
                          )
                          appendLine(
                              "EXPOSURE_MAX_MS=" +
                                  String.format(Locale.US,"%.2f",maxExpMs)
                          )
                          appendLine("FOCUS_CONFIDENCE=$focusPct%")
                          appendLine(
                              "ANALYSIS_LUMA=" +
