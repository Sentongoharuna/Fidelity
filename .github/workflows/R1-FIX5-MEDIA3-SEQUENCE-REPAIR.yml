          grep -Fq 'V16_LENS_EVALUATION' "$M"
          grep -Fq 'V16_MEDIA_ENHANCEMENT' "$M"
          grep -Fq 'V16_REFERENCE' "$M"
          grep -Fq 'V16_AB_SCORE' "$M"
          grep -Fq 'CAPTURE SCORE' "$M"
          grep -Fq 'media3-transformer:1.11.1' app/build.gradle.kts

