                                  camera?.cameraControl?.setExposureCompensationIndex(target)
                                  statusView.text = "HIGHLIGHT PROTECT • EV INDEX $target"
                              } else {
                                  statusView.text = "EV CONTROL NOT EXPOSED BY DEVICE"
                              }
                          }
                      }

                  controls.addView(
                      lensButton,
                      LinearLayout.LayoutParams(0, dp(56), 1f)
                  )
                  controls.addView(
                      exposureButton,
                      LinearLayout.LayoutParams(0, dp(56), 1f).apply {
                          marginStart = dp(8)
                      }
                  )
                  fidelityButton =
                      Button(this).apply {
                          text = "FID REF"
                          setOnClickListener {
                              fidelityStrength =
                                  when {
                                      fidelityStrength < 0.9f -> 1.0f
                                      fidelityStrength < 1.1f -> 1.18f
                                      else -> 0.78f
                                  }
                              text =
                                  when {
                                      fidelityStrength > 1.1f -> "FID MAX"
                                      fidelityStrength < 0.9f -> "FID NAT"
                                      else -> "FID REF"
                                  }
                              statusView.text =
                                  "FIDELITY PROCESS • " +
                                  String.format(
                                      Locale.US,
                                      "%.2fx",
                                      fidelityStrength
                                  )
                          }
                      }
                  controls.addView(
                      fidelityButton,
                      LinearLayout.LayoutParams(0, dp(56), 1f).apply {
                          marginStart = dp(8)
                      }
                  )
                  controls.addView(
                      recordButton,
                      LinearLayout.LayoutParams(0, dp(64), 2f).apply {
                          marginStart = dp(12)
                      }
                  )

                  root.addView(
                      controls,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.WRAP_CONTENT,
                          Gravity.BOTTOM
                      )
                  )

                  setContentView(root)

                  previewView.setOnTouchListener { _, event ->
                      if (event.action == android.view.MotionEvent.ACTION_UP) {
                          val point =
                              previewView.meteringPointFactory.createPoint(
                                  event.x,
                                  event.y
                              )
                          camera?.cameraControl?.startFocusAndMetering(
                              FocusMeteringAction.Builder(point)
                                  .setAutoCancelDuration(3, TimeUnit.SECONDS)
                                  .build()
                          )
                          focusTouched = true
                          statusView.text = "FOCUS / METERING SET"
                          updateQualityHud()
                      }
                      true
                  }
              }

              private fun analyzeFrame(image: ImageProxy) {
                  try {
                      analysisFrameCounter++
                      // Sample only every 6th analysis frame to protect recording.
                      if (analysisFrameCounter % 6 != 0) return

                      val plane = image.planes.firstOrNull() ?: return
                      val buffer = plane.buffer
                      val rowStride = plane.rowStride
                      val pixelStride = plane.pixelStride
                      val width = image.width
                      val height = image.height
                      if (width <= 0 || height <= 0) return

                      var sum = 0L
                      var count = 0
                      var highlights = 0
                      var detailSum = 0L
                      val stepX = 16
                      val stepY = 16
                      var y = 0
                      while (y < height) {
                          var x = 0
                          var prev = -1
                          while (x < width) {
                              val index = y * rowStride + x * pixelStride
                              if (index >= 0 && index < buffer.limit()) {
                                  val v = buffer.get(index).toInt() and 0xFF
                                  sum += v
                                  count++
                                  if (v >= 238) highlights++
                                  if (prev >= 0) {
                                      detailSum += kotlin.math.abs(v - prev)
                                  }
                                  prev = v
                              }
                              x += stepX
                          }
                          y += stepY
                      }
                      if (count > 0) {
                          val luma = sum.toFloat() / count.toFloat()
                          sceneLuma = luma
                          sceneHighlightPct =
                              highlights.toFloat() * 100f / count.toFloat()
                          sceneDetail =
                              detailSum.toFloat() /
                                  kotlin.math.max(1,count)
                          if (previousLuma >= 0f) {
                              val delta =
                                  kotlin.math.abs(luma - previousLuma)
                              sceneMotion =
                                  sceneMotion * 0.82f + delta * 0.18f
                          }
                          previousLuma = luma
                          runOnUiThread { updateQualityHud() }
                      }
                  } finally {
                      image.close()
                  }
              }

              private fun buildAnalysis(): ImageAnalysis =
                  ImageAnalysis.Builder()
                      .setTargetResolution(Size(640,480))
                      .setBackpressureStrategy(
                          ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST
                      )
                      .build()
                      .also {
                          it.setAnalyzer(
                              analysisExecutor
                          ) { frame ->
                              analyzeFrame(frame)
                          }
                      }

              private fun startCamera() {
                  statusView.text = "OPENING CAMERA…"
                  val future = ProcessCameraProvider.getInstance(this)

                  future.addListener(
                      {
                          val provider = future.get()
                          cameraProvider = provider
                          provider.unbindAll()

                          val selector =
                              if (frontCamera) {
                                  CameraSelector.DEFAULT_FRONT_CAMERA
                              } else {
                                  FidelitySceneIntelligence.chooseBackLens(
                                      provider.availableCameraInfos
                                  )
                              }

                          val previewBuilder = Preview.Builder()
                          runCatching {
                              Camera2Interop.Extender(previewBuilder)
                                  .setCaptureRequestOption(
                                      CaptureRequest.EDGE_MODE,
                                      CaptureRequest.EDGE_MODE_FAST
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.NOISE_REDUCTION_MODE,
                                      CaptureRequest.NOISE_REDUCTION_MODE_FAST
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_AF_MODE,
                                      CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_VIDEO
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE,
                                      CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE,
                                      Range(30, 30)
                                  )
                                  .setSessionCaptureCallback(
                                      object : android.hardware.camera2.CameraCaptureSession.CaptureCallback() {
                                          override fun onCaptureCompleted(
                                              session: android.hardware.camera2.CameraCaptureSession,
                                              request: android.hardware.camera2.CaptureRequest,
                                              result: android.hardware.camera2.TotalCaptureResult
                                          ) {
                                              actualIso = result.get(CaptureResult.SENSOR_SENSITIVITY)
                                              actualExposureNs = result.get(CaptureResult.SENSOR_EXPOSURE_TIME)
                                              actualAfState = result.get(CaptureResult.CONTROL_AF_STATE)
                                              if (recording != null) {
                                                  actualIso?.let {
                                                      takeMinIso = minOf(takeMinIso,it)
                                                      takeMaxIso = maxOf(takeMaxIso,it)
                                                  }
                                                  actualExposureNs?.let {
                                                      takeMinExposureNs =
                                                          minOf(takeMinExposureNs,it)
                                                      takeMaxExposureNs =
                                                          maxOf(takeMaxExposureNs,it)
                                                  }
                                                  when (actualAfState) {
                                                      CaptureResult.CONTROL_AF_STATE_FOCUSED_LOCKED,
                                                      CaptureResult.CONTROL_AF_STATE_PASSIVE_FOCUSED ->
                                                          takeFocusGood++
                                                      CaptureResult.CONTROL_AF_STATE_NOT_FOCUSED_LOCKED,
                                                      CaptureResult.CONTROL_AF_STATE_PASSIVE_UNFOCUSED ->
                                                          takeFocusBad++
                                                  }
                                              }
                                              runOnUiThread { updateQualityHud() }
                                          }
                                      }
                                  )
                          }

                          val preview =
                              previewBuilder
                                  .build()
                                  .also {
                                      it.setSurfaceProvider(
                                          previewView.surfaceProvider
                                      )
                                  }

                          // Keep V1's proven CameraX binding path. The
                          // QualitySelector itself performs capability fallback;
                          // do not call a provider CameraInfo API that is not
                          // available in this CameraX version.
                          activeQualityLabel = "1080 TARGET • AUTO FALLBACK"

                          val recorder =
                              Recorder.Builder()
                                  .setQualitySelector(
                                      FidelityEngine.qualitySelector()
                                  )
                                  .build()

                          val videoBuilder = VideoCapture.Builder(recorder)
                          runCatching {
                              Camera2Interop.Extender(videoBuilder)
                                  .setCaptureRequestOption(
                                      CaptureRequest.EDGE_MODE,
                                      CaptureRequest.EDGE_MODE_FAST
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.NOISE_REDUCTION_MODE,
                                      CaptureRequest.NOISE_REDUCTION_MODE_FAST
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_AF_MODE,
                                      CaptureRequest.CONTROL_AF_MODE_CONTINUOUS_VIDEO
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE,
                                      CaptureRequest.CONTROL_VIDEO_STABILIZATION_MODE_ON
                                  )
                                  .setCaptureRequestOption(
                                      CaptureRequest.CONTROL_AE_TARGET_FPS_RANGE,
                                      Range(30, 30)
                                  )
                          }
                          videoCapture = videoBuilder.build()

                          val analysis =
                              if (analysisEnabled) buildAnalysis()
                              else null

                          val bound =
                              runCatching {
                                  if (analysis != null) {
                                      provider.bindToLifecycle(
                                          this,
                                          selector,
                                          preview,
                                          videoCapture,
                                          analysis
                                      )
                                  } else {
                                      provider.bindToLifecycle(
                                          this,
                                          selector,
                                          preview,
                                          videoCapture
                                      )
                                  }
                              }.recoverCatching {
                                  // Analysis must never cost us recording.
                                  analysisEnabled = false
                                  provider.unbindAll()
                                  provider.bindToLifecycle(
                                      this,
                                      selector,
                                      preview,
                                      videoCapture
                                  )
                              }

                          bound.onSuccess {
                              camera = it
                              statusView.text =
                                  "READY • ${FidelityEngine.NAME} • $activeQualityLabel • SOURCE DETAIL"
                              updateQualityHud()
                          }.onFailure {
                              statusView.text =
                                  "CAMERA UNAVAILABLE • ${it.javaClass.simpleName}"
                          }
                      },
                      ContextCompat.getMainExecutor(this)
                  )
              }

              private fun updateQualityHud() {
                  val exposure =
                      camera?.cameraInfo?.exposureState
                          ?.exposureCompensationIndex ?: 0
                  val q =
                      FidelitySceneIntelligence.classify(
                          exposureIndex = exposure,
                          recording = recording != null,
                          focusLocked = focusTouched
                      )
                  val exposureMs = actualExposureNs?.div(1_000_000.0)
                  val focusState =
                      when (actualAfState) {
                          CaptureResult.CONTROL_AF_STATE_FOCUSED_LOCKED,
                          CaptureResult.CONTROL_AF_STATE_PASSIVE_FOCUSED -> "GOOD"
                          CaptureResult.CONTROL_AF_STATE_NOT_FOCUSED_LOCKED,
                          CaptureResult.CONTROL_AF_STATE_PASSIVE_UNFOCUSED -> "CHECK"
                          else -> q.focus
                      }
                  captureProfile =
                      if ((actualIso ?: 0) >= 800) "LOW LIGHT"
                      else "REFERENCE"
                  val iso = actualIso ?: 0
                  val blurRisk =
                      (actualExposureNs ?: 0L) > 20_000_000L
                  val director =
                      when {
                          focusState == "CHECK" -> "REFOCUS"
                          iso >= 1200 -> "HIGH ISO"
                          sceneHighlightPct >= 6f -> "HIGHLIGHT RISK"
                          blurRisk || sceneMotion >= 4.5f -> "BLUR RISK"
                          else -> "READY"
                      }
                  captureProfile =
                      when {
                          iso >= 800 || sceneLuma < 55f -> "LOW LIGHT"
                          blurRisk || sceneMotion >= 4.5f -> "MOTION"
                          sceneDetail >= 12f -> "DETAIL"
                          else -> "REFERENCE"
                      }
                  val lab =
                      FidelityQualityLab.state(
                          exposureNs = actualExposureNs,
                          iso = actualIso,
                          enhancementPresent = enhancementState.apiPresent,
                          analysisActive = analysisEnabled
                      )
                  qualityHud.text =
                      "$director • FOCUS $focusState • ISO $iso • EXP " +
                      (exposureMs?.let {
                          String.format(Locale.US,"%.1fms",it)
                      } ?: "--") +
                      " • $captureProfile • " +
                      "Y " + String.format(Locale.US,"%.0f",sceneLuma) +
                      " • CLIP " +
                      String.format(Locale.US,"%.1f%%",sceneHighlightPct) +
                      " • DETAIL " +
                      String.format(Locale.US,"%.1f",sceneDetail) +
                      " • " + enhancementState.label +
                      " • SHUTTER " + lab.shutter +
                      " • ISO " + lab.isoCeiling +
                      " • REF " + lab.referenceCalibration
              }

              private fun toggleRecording() {
                  val capture = videoCapture ?: run {
                      statusView.text = "CAMERA STILL STARTING"
                      return
                  }

                  if (recording != null) {
                      statusView.text = "SAVING CLEAN MASTER…"
                      recordButton.isEnabled = false
                      recording?.stop()
                      return
                  }

                  val displayName =
                      "FIDELITY_ORIGINAL_" +
                          SimpleDateFormat(
                              "yyyyMMdd_HHmmss",
                              Locale.US
                          ).format(Date()) +
                          ".mp4"

                  val values =
                      ContentValues().apply {
                          put(
                              MediaStore.Video.Media.DISPLAY_NAME,
                              displayName
                          )
                          put(
                              MediaStore.Video.Media.MIME_TYPE,
                              "video/mp4"
                          )
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(
                                  MediaStore.Video.Media.RELATIVE_PATH,
                                  "Movies/FidelityCam"
                              )
                          }
                      }

                  val output =
                      MediaStoreOutputOptions.Builder(
                          contentResolver,
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI
                      )
                          .setContentValues(values)
                          .build()

                  var pending =
                      capture.output.prepareRecording(this, output)

                  if (
                      ContextCompat.checkSelfPermission(
                          this,
                          Manifest.permission.RECORD_AUDIO
                      ) == PackageManager.PERMISSION_GRANTED
                  ) {
                      pending = pending.withAudioEnabled()
                  }

                  recording =
                      pending.start(
                          ContextCompat.getMainExecutor(this)
                      ) { event ->
                          when (event) {
                              is VideoRecordEvent.Start -> {
                                  takeMinIso = Int.MAX_VALUE
                                  takeMaxIso = 0
                                  takeMinExposureNs = Long.MAX_VALUE
                                  takeMaxExposureNs = 0L
                                  takeFocusGood = 0
                                  takeFocusBad = 0
                                  recordButton.text = "■ STOP"
                                  recordButton.isEnabled = true
                                  lensButton.isEnabled = false
                                  exposureButton.isEnabled = false
                                  fidelityButton.isEnabled = false
                                  statusView.text =
                                      "● REC • $activeQualityLabel • V6 FIDELITY IMAGE CLEAN"
                              }

                              is VideoRecordEvent.Finalize -> {
                                  recording = null
                                  recordButton.text = "● REC"
                                  recordButton.isEnabled = true
                                  lensButton.isEnabled = true
                                  exposureButton.isEnabled = true
                                  fidelityButton.isEnabled = true

                                  statusView.text =
                                      if (event.hasError()) {
                                          "SAVE ERROR • ${event.error}"
                                      } else {
                                          "ORIGINAL SAVED • BUILDING COMPRESSED COPY"
                                      }

                                  if (!event.hasError()) {
                                      processFidelityImage(
                                          event.outputResults.outputUri
                                      )
                                  }
                              }
                          }
                      }
              }

              private fun processFidelityImage(cleanUri: android.net.Uri) {
                  val cache =
                      File(cacheDir, "fidelity_v6").apply { mkdirs() }
                  val temp =
                      File(
                          cache,
                          "FIDELITY_${System.currentTimeMillis()}.mp4"
                      )
                  if (temp.exists()) temp.delete()

                  // V6 R5 MOTION DETAIL: stable 30fps AE target, restrained processing, no social compression.
                  // This modifies the pixels in the second render; CLEAN is read-only.
                  val videoEffects =
                      listOf(
                          FidelityAdaptiveEffect(
                              strength =
                                  if (captureProfile == "LOW LIGHT") 0.70f
                                  else fidelityStrength
                          )
                      )

                  val edited =
                      EditedMediaItem.Builder(
                          MediaItem.Builder()
                              .setUri(cleanUri)
                              .build()
                      )
                          .setEffects(
                              Effects(
                                  emptyList(),
                                  videoEffects
                              )
                          )
                          .build()

                  val composition =
                      Composition.Builder(
                          listOf(
                              EditedMediaItemSequence(
                                  listOf(edited)
                              )
                          )
                      ).build()

                  val encoderFactory =
                      DefaultEncoderFactory.Builder(this)
                          .setRequestedVideoEncoderSettings(
                              VideoEncoderSettings.Builder()
                                  .setBitrate(12_000_000)
                                  .setiFrameIntervalSeconds(2f)
                                  .build()
                          )
                          .build()

                  fidelityTransformer =
                      Transformer.Builder(this)
                          .setEncoderFactory(encoderFactory)
                          .setVideoMimeType(MimeTypes.VIDEO_H264)
                          .setAudioMimeType(MimeTypes.AUDIO_AAC)
                          .addListener(
                              object : Transformer.Listener {
                                  override fun onCompleted(
                                      composition: Composition,
                                      result: ExportResult
                                  ) {
                                      publishFidelityImage(temp)
                                      fidelityTransformer = null
                                      temp.delete()
                                  }

                                  override fun onError(
                                      composition: Composition,
                                      result: ExportResult,
                                      exception: ExportException
                                  ) {
                                      fidelityTransformer = null
                                      temp.delete()
                                      runOnUiThread {
                                          statusView.text =
                                              "ORIGINAL SAFE • COMPRESSED FAILED"
                                      }
                                  }
                              }
                          )
                          .build()
                          .also {
                              it.start(
                                  composition,
                                  temp.absolutePath
                              )
                          }
              }

              private fun publishFidelityImage(temp: File) {
                  if (!temp.exists() || temp.length() <= 0L) {
                      runOnUiThread {
                          statusView.text =
                              "ORIGINAL SAFE • COMPRESSED EMPTY"
                      }
                      return
                  }

                  val name =
                      "FIDELITY_COMPRESSED_" +
                          SimpleDateFormat(
                              "yyyyMMdd_HHmmss",
                              Locale.US
                          ).format(Date()) +
                          ".mp4"

                  val values =
                      ContentValues().apply {
                          put(
                              MediaStore.Video.Media.DISPLAY_NAME,
                              name
                          )
                          put(
                              MediaStore.Video.Media.MIME_TYPE,
                              "video/mp4"
                          )
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(
                                  MediaStore.Video.Media.RELATIVE_PATH,
                                  "Movies/FidelityCam/Compressed"
                              )
                              put(
                                  MediaStore.Video.Media.IS_PENDING,
                                  1
                              )
                          }
                      }

                  val uri =
                      contentResolver.insert(
                          MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                          values
                      )

                  if (uri == null) {
                      runOnUiThread {
                          statusView.text =
                              "ORIGINAL SAFE • COMPRESSED PUBLISH FAILED"
                      }
                      return
                  }

                  runCatching {
                      contentResolver
                          .openOutputStream(uri, "w")
                          ?.use { output ->
                              FileInputStream(temp).use { input ->
                                  input.copyTo(output, 1024 * 1024)
                              }
                          }
                          ?: error("Output stream unavailable")

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          contentResolver.update(
                              uri,
                              ContentValues().apply {
                                  put(
                                      MediaStore.Video.Media.IS_PENDING,
                                      0
                                  )
                              },
                              null,
                              null
                          )
                      }
                  }.onSuccess {
                      publishTakeReport()
                      val captureScore =
                          (
                              100f -
                              sceneHighlightPct * 2f -
                              kotlin.math.min(35f,sceneMotion * 2f) +
                              kotlin.math.min(20f,sceneDetail)
                          ).coerceIn(0f,100f)
                      runOnUiThread {
                          qualityHud.text =
                              qualityHud.text.toString() +
                              " • CAPTURE SCORE " +
                              String.format(Locale.US,"%.0f",captureScore)
                          statusView.text =
                              "V16 COMPLETE • ORIGINAL + COMPRESSED • QUALITY LAB REPORT"
                      }
                  }.onFailure {
                      runCatching {
                          contentResolver.delete(uri, null, null)
                      }
                      runOnUiThread {
                          statusView.text =
                              "CLEAN SAFE • FIDELITY PUBLISH FAILED"
                      }
                  }
              }

              private fun publishTakeReport() {
                  val focusTotal = takeFocusGood + takeFocusBad
                  val focusPct =
                      if (focusTotal > 0) {
                          (takeFocusGood * 100) / focusTotal
                      } else 0
                  val minIso =
                      if (takeMinIso == Int.MAX_VALUE) 0 else takeMinIso
                  val minExpMs =
                      if (takeMinExposureNs == Long.MAX_VALUE) 0.0
                      else takeMinExposureNs / 1_000_000.0
                  val maxExpMs =
                      takeMaxExposureNs / 1_000_000.0
                  val report =
                      buildString {
                          appendLine("FIDELITY V13 TAKE QUALITY REPORT")
                          appendLine("PROFILE=$captureProfile")
                          appendLine("ISO_MIN=$minIso")
                          appendLine("ISO_MAX=$takeMaxIso")
                          appendLine(
                              "EXPOSURE_MIN_MS=" +
                                  String.format(Locale.US,"%.2f",minExpMs)
                          )
                          appendLine(
                              "EXPOSURE_MAX_MS=" +
                                  String.format(Locale.US,"%.2f",maxExpMs)
                          )
                          appendLine("FOCUS_CONFIDENCE=$focusPct%")
                          appendLine(
                              "ANALYSIS_LUMA=" +
                                  String.format(Locale.US,"%.2f",sceneLuma)
                          )
                          appendLine(
                              "ANALYSIS_HIGHLIGHT_PCT=" +
                                  String.format(Locale.US,"%.2f",sceneHighlightPct)
                          )
                          appendLine(
                              "ANALYSIS_DETAIL=" +
                                  String.format(Locale.US,"%.2f",sceneDetail)
                          )
                          appendLine(
                              "ANALYSIS_MOTION=" +
                                  String.format(Locale.US,"%.2f",sceneMotion)
                          )
                          appendLine(
                              "ENHANCEMENT_API_PRESENT=" +
                                  enhancementState.apiPresent
                          )
                          appendLine(
                              "ENHANCEMENT_API_ELIGIBLE=" +
                                  enhancementState.eligibleApiLevel
                          )
                          val lab =
                              FidelityQualityLab.state(
                                  exposureNs = actualExposureNs,
                                  iso = actualIso,
                                  enhancementPresent =
                                      enhancementState.apiPresent,
                                  analysisActive = analysisEnabled
                              )
                          appendLine("V16_TEMPORAL_DENOISE=" + lab.temporalDenoise)
                          appendLine("V16_TEMPORAL_DETAIL=" + lab.temporalDetail)
                          appendLine("V16_PIXEL_MOTION=" + lab.motionVectors)
                          appendLine("V16_SHUTTER=" + lab.shutter)
                          appendLine("V16_ISO_CEILING=" + lab.isoCeiling)
                          appendLine("V16_FACE_SEGMENTATION=" + lab.faceSegmentation)
                          appendLine("V16_LENS_EVALUATION=" + lab.lensEvaluation)
                          appendLine("V16_MEDIA_ENHANCEMENT=" + lab.mediaEnhancement)
                          appendLine("V16_REFERENCE=" + lab.referenceCalibration)
                          appendLine("V16_AB_SCORE=" + lab.abScore)
                          appendLine("OUTPUTS=ORIGINAL,COMPRESSED")
                      }
                  val values =
                      ContentValues().apply {
                          put(
                              MediaStore.Downloads.DISPLAY_NAME,
                              "FIDELITY_TAKE_REPORT_" +
                                  System.currentTimeMillis() +
                                  ".txt"
                          )
                          put(
                              MediaStore.Downloads.MIME_TYPE,
                              "text/plain"
                          )
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                              put(
                                  MediaStore.Downloads.RELATIVE_PATH,
                                  "Download/FidelityCam"
                              )
                          }
                      }
                  runCatching {
                      contentResolver.insert(
                          MediaStore.Downloads.EXTERNAL_CONTENT_URI,
                          values
                      )?.let { uri ->
                          contentResolver.openOutputStream(uri)?.use {
                              it.write(report.toByteArray())
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  recording?.stop()
                  fidelityTransformer?.cancel()
                  cameraProvider?.unbindAll()
                  analysisExecutor.shutdownNow()
                  super.onDestroy()
              }

              private fun dp(value: Int): Int =
                  (value * resources.displayMetrics.density).toInt()
          }
          EOF

      - name: V16 full quality lab gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'FIDELITY IMAGE V6' app/src/main/java/com/sentongoharuna/fidelity/FidelityEngine.kt
          grep -q 'listOf(Quality.FHD, Quality.UHD, Quality.HD, Quality.SD)' app/src/main/java/com/sentongoharuna/fidelity/FidelityEngine.kt
