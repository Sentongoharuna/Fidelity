          package com.sentongoharuna.fidelity

          import androidx.camera.video.FallbackStrategy
          import androidx.camera.video.Quality
          import androidx.camera.video.QualitySelector

          object FidelityEngine {
              const val NAME = "FIDELITY V16 • QUALITY LAB"
              const val TARGET_FPS = 30
              const val INTENT = "FIDELITY IMAGE • SOURCE DETAIL FIRST • CLEAN MASTER"
              const val REFERENCE_SET = "576x1024/30 + 720x1280/30 + 1080x1920/60"
              const val DETAIL_POLICY = "NATURAL DETAIL • HIGHLIGHT PROTECT • NO SOCIAL COMPRESSION"

              fun qualitySelector(): QualitySelector =
                  QualitySelector.fromOrderedList(
                      listOf(Quality.FHD, Quality.UHD, Quality.HD, Quality.SD),
                      FallbackStrategy.lowerQualityOrHigherThan(Quality.FHD)
                  )

              fun qualityLabel(quality: Quality?): String =
                  when (quality) {
                      Quality.UHD -> "2160 MASTER"
                      Quality.FHD -> "1080 FIDELITY"
                      Quality.HD -> "720 FALLBACK"
                      Quality.SD -> "SD FALLBACK"
                      else -> "AUTO"
                  }
          }
          EOF

          cat > app/src/main/java/com/sentongoharuna/fidelity/FidelityAdaptiveEffect.kt <<'EOF'
          package com.sentongoharuna.fidelity

          import android.content.Context
          import androidx.media3.common.VideoFrameProcessingException
          import androidx.media3.common.util.GlProgram
          import androidx.media3.common.util.GlUtil
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.effect.BaseGlShaderProgram
          import androidx.media3.effect.GlEffect
          import androidx.media3.effect.GlShaderProgram

          /**
           * V8 Fidelity look.
           * Real pixel-domain processing:
           * - fine + medium scale luma separation
           * - shadow/highlight protection
           * - halo-limited reconstruction
           * - skin/chroma protection
           * CLEAN input is never overwritten.
           */
          @UnstableApi
          class FidelityAdaptiveEffect(
              private val strength: Float = 1.0f
          ) : GlEffect {
              override fun toGlShaderProgram(
                  context: Context,
                  useHdr: Boolean
              ): GlShaderProgram =
                  Program(context, strength.coerceIn(0.0f, 1.2f))

              private class Program(
                  context: Context,
                  private val strength: Float
              ) : BaseGlShaderProgram(false, 1) {
                  private val gl: GlProgram

                  init {
                      val vertex = """
                          #version 100
                          attribute vec4 aFramePosition;
                          varying vec2 vTex;
                          void main() {
                              gl_Position = aFramePosition;
                              vTex = aFramePosition.xy * 0.5 + 0.5;
                          }
                      """.trimIndent()

                      val fragment = """
                          #version 100
                          precision highp float;
                          uniform sampler2D uTexSampler;
                          uniform vec2 uTexel;
                          uniform float uStrength;
                          varying vec2 vTex;

                          float Y(vec3 c) {
                              return dot(c, vec3(0.2126,0.7152,0.0722));
                          }
                          vec3 S(vec2 p) {
                              return texture2D(
                                  uTexSampler,
                                  clamp(p,0.0,1.0)
                              ).rgb;
                          }

                          void main() {
                              vec3 c = S(vTex);
                              float y = Y(c);

                              vec3 n1=S(vTex+vec2(0.0,-uTexel.y));
                              vec3 s1=S(vTex+vec2(0.0, uTexel.y));
                              vec3 e1=S(vTex+vec2( uTexel.x,0.0));
                              vec3 w1=S(vTex+vec2(-uTexel.x,0.0));
                              vec3 fineBase=(n1+s1+e1+w1)*0.25;

                              vec2 t2=uTexel*2.0;
                              vec3 n2=S(vTex+vec2(0.0,-t2.y));
                              vec3 s2=S(vTex+vec2(0.0, t2.y));
                              vec3 e2=S(vTex+vec2( t2.x,0.0));
                              vec3 w2=S(vTex+vec2(-t2.x,0.0));
                              vec3 midBase=(n2+s2+e2+w2)*0.25;

                              float yf=Y(fineBase);
                              float ym=Y(midBase);

                              float fine=clamp(y-yf,-0.032,0.032);
                              float medium=clamp(yf-ym,-0.055,0.055);

                              float shadow=smoothstep(0.08,0.25,y);
                              float highlights=
                                  1.0-smoothstep(0.70,0.94,y);
                              float useful=shadow*highlights;

                              // Avoid boosting flat noisy areas.
                              float structure=
                                  smoothstep(
                                      0.003,
                                      0.020,
                                      abs(fine)+abs(medium)
                                  );

                              // Local disagreement is used as a noise/instability
                              // proxy. Strong random high-frequency disagreement
                              // gets less gain than coherent medium-scale structure.
                              float localSpread =
                                  abs(Y(n1)-Y(s1)) +
                                  abs(Y(e1)-Y(w1));
                              float noiseProtect =
                                  1.0-smoothstep(
                                      0.055,
                                      0.180,
                                      localSpread
                                  );

                              // Edge limiter prevents strong high-contrast
                              // boundaries from becoming outlined/haloed.
                              float edgeMagnitude =
                                  abs(Y(e1)-Y(w1)) +
                                  abs(Y(n1)-Y(s1));
                              float haloProtect =
                                  1.0-smoothstep(
                                      0.12,
                                      0.34,
                                      edgeMagnitude
                                  );

                              float adaptive =
                                  useful *
                                  structure *
                                  max(0.22,noiseProtect) *
                                  max(0.30,haloProtect);

                              float fineGain=
                                  1.0+0.95*uStrength*adaptive;
                              float midGain=
                                  1.0+0.66*uStrength*adaptive;

                              float yd=
                                  ym+
                                  medium*midGain+
                                  fine*fineGain;

                              // Gentle midtone separation.
                              float centered=yd-0.5;
                              float yt=
                                  0.5+
                                  centered*(1.0+0.075*uStrength);

                              // Highlight shoulder.
                              if (yt>0.72) {
                                  float h=(yt-0.72)/0.28;
                                  h=h/(1.0+0.62*uStrength*h);
                                  yt=0.72+h*0.28;
                              }

                              // Chroma/skin protection: detail work is luma-first.
                              vec3 chroma=c-vec3(y);
                              float skin=
                                  smoothstep(0.02,0.15,c.r-c.b)*
                                  smoothstep(-0.01,0.11,c.r-c.g)*
                                  smoothstep(0.16,0.84,y);
                              // Skin keeps chroma natural and gets a
                              // small luminance-detail relaxation.
                              float skinRelax = 1.0-0.10*skin*uStrength;
                              yt = mix(y,yt,skinRelax);
                              float cg=mix(1.018,1.0,skin);
                              vec3 outRgb=vec3(yt)+chroma*cg;

                              gl_FragColor=
                                  vec4(clamp(outRgb,0.0,1.0),1.0);
                          }
                      """.trimIndent()

                      gl = GlProgram(context, vertex, fragment)
                      gl.setBufferAttribute(
                          "aFramePosition",
                          GlUtil.getNormalizedCoordinateBounds(),
                          4
                      )
                  }

                  override fun configure(
                      inputWidth: Int,
                      inputHeight: Int
                  ): android.util.Size =
                      android.util.Size(inputWidth,inputHeight)

                  override fun drawFrame(
                      inputTexId: Int,
                      presentationTimeUs: Long
                  ) {
                      try {
                          gl.use()
                          gl.setSamplerTexIdUniform(
                              "uTexSampler",
                              inputTexId,
                              0
                          )
                          gl.setFloatsUniform(
                              "uTexel",
                              floatArrayOf(
                                  1f/outputWidth.toFloat(),
                                  1f/outputHeight.toFloat()
                              )
                          )
                          gl.setFloatUniform(
                              "uStrength",
                              strength
                          )
                          gl.bindAttributesAndUniforms()
                          gl.draw()
                      } catch (e: Exception) {
                          throw VideoFrameProcessingException(e)
                      }
                  }

                  override fun release() {
                      super.release()
                      gl.delete()
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/sentongoharuna/fidelity/FidelitySceneIntelligence.kt <<'EOF'
          package com.sentongoharuna.fidelity

          import androidx.camera.core.CameraInfo
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ZoomState

          enum class FidelityScene {
              FACE,
              DETAIL,
              MOTION,
              LOW_LIGHT,
              GENERAL
          }

          data class FidelityQualityState(
              val scene: FidelityScene,
              val focus: String,
              val motion: String,
              val light: String,
              val highlights: String,
              val profile: String
          )

          object FidelitySceneIntelligence {
              fun chooseBackLens(
                  infos: List<CameraInfo>
              ): CameraSelector {
                  // Prefer a normal back camera. Avoid blindly selecting an
                  // auxiliary tele/ultrawide physical path without proof that
                  // it improves video capture on this device.
                  return CameraSelector.DEFAULT_BACK_CAMERA
              }

              fun classify(
                  exposureIndex: Int,
                  recording: Boolean,
                  focusLocked: Boolean
              ): FidelityQualityState {
                  val low = exposureIndex >= 2
                  val scene =
                      when {
                          recording -> FidelityScene.MOTION
                          low -> FidelityScene.LOW_LIGHT
                          else -> FidelityScene.DETAIL
                      }
                  return FidelityQualityState(
                      scene = scene,
                      focus = if (focusLocked) "LOCK" else "AUTO",
                      motion = if (recording) "ACTIVE" else "STABLE",
                      light = if (low) "LOW" else "GOOD",
                      highlights =
                          if (exposureIndex < 0) "PROTECTED"
                          else "AUTO",
                      profile =
                          when (scene) {
                              FidelityScene.MOTION -> "NATURAL"
                              FidelityScene.LOW_LIGHT -> "NATURAL"
                              FidelityScene.FACE -> "SKIN"
                              FidelityScene.DETAIL -> "REFERENCE"
                              FidelityScene.GENERAL -> "REFERENCE"
                          }
                  )
              }
          }
          EOF

          cat > app/src/main/java/com/sentongoharuna/fidelity/FidelityEnhancementBridge.kt <<'EOF'
          package com.sentongoharuna.fidelity

          import android.content.Context
          import android.os.Build

          /**
           * Optional Google Play services Media Enhancement bridge.
           * It never blocks capture and never makes ORIGINAL depend on the module.
           * V15 probes support; the proven Media3 Fidelity processor remains the
           * deterministic fallback.
           */
          object FidelityEnhancementBridge {
              data class State(
                  val apiPresent: Boolean,
                  val eligibleApiLevel: Boolean,
                  val label: String
              )

              fun probe(context: Context): State {
                  val eligible = Build.VERSION.SDK_INT >= 30
                  val present =
                      runCatching {
                          Class.forName(
                              "com.google.android.gms.media.effect.enhancement.Enhancement"
                          )
                          true
                      }.getOrDefault(false)

                  return State(
                      apiPresent = present,
                      eligibleApiLevel = eligible,
                      label =
                          when {
                              !eligible -> "ENHANCEMENT API REQUIRES ANDROID 11+"
                              present -> "ENHANCEMENT API PRESENT"
                              else -> "ENHANCEMENT MODULE NOT PRESENT • FIDELITY FALLBACK"
                          }
                  )
              }
          }
          EOF

          cat > app/src/main/java/com/sentongoharuna/fidelity/FidelityQualityLab.kt <<'EOF'
          package com.sentongoharuna.fidelity

          data class FidelityLabState(
              val temporalDenoise: String,
              val temporalDetail: String,
              val motionVectors: String,
              val shutter: String,
              val isoCeiling: String,
              val faceSegmentation: String,
              val lensEvaluation: String,
              val mediaEnhancement: String,
              val referenceCalibration: String,
              val abScore: String
          )

          object FidelityQualityLab {
              const val TARGET_SHUTTER_NS = 16_666_667L
              const val ISO_SOFT_CEILING = 800
              const val REFERENCE_PROFILE = "FIDELITY_REFERENCE_01"

              fun state(
                  exposureNs: Long?,
                  iso: Int?,
                  enhancementPresent: Boolean,
                  analysisActive: Boolean
              ): FidelityLabState {
                  val shutter =
                      when {
                          exposureNs == null -> "UNKNOWN"
                          exposureNs <= 20_000_000L -> "GOOD"
                          else -> "BLUR RISK"
                      }
                  val isoState =
                      when {
                          iso == null -> "UNKNOWN"
                          iso <= ISO_SOFT_CEILING -> "GOOD"
                          else -> "HIGH"
                      }
                  return FidelityLabState(
                      temporalDenoise =
                          if (analysisActive) "ANALYSIS READY" else "FALLBACK",
                      temporalDetail =
                          if (analysisActive) "ANALYSIS READY" else "FALLBACK",
                      motionVectors = "GPU NEXT-STAGE",
                      shutter = shutter,
                      isoCeiling = isoState,
                      faceSegmentation = "SAFE HEURISTIC",
                      lensEvaluation = "PRIMARY BACK",
                      mediaEnhancement =
                          if (enhancementPresent) "AVAILABLE" else "FALLBACK",
                      referenceCalibration = REFERENCE_PROFILE,
                      abScore = "POST-TAKE"
                  )
              }
          }
          EOF

