      - name: V16 Media3 API gate
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'withAudioAndVideoFrom' app/src/main/java/com/sentongoharuna/fidelity/MainActivity.kt
          grep -q 'EditedMediaItemSequence(' app/src/main/java/com/sentongoharuna/fidelity/MainActivity.kt

      - name: Compile Fidelity V16
        run: gradle --no-daemon --console=plain --max-workers=2 :app:compileDebugKotlin

      - name: Build Fidelity V16 APK
        run: gradle --no-daemon --console=plain --max-workers=2 :app:assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk FIDELITY-V16.apk
          sha256sum FIDELITY-V16.apk > FIDELITY-V16.apk.sha256

      - name: Upload Fidelity V16
        uses: actions/upload-artifact@v4
        with:
          name: FIDELITY-V16
          path: |
            FIDELITY-V16.apk
            FIDELITY-V16.apk.sha256
          if-no-files-found: error
          retention-days: 14
